name: CI Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check forbidden sensitive files
        run: |
          if [ -f .env ] || [ -f DEPLOY_ECS.md ] || ls .env.* 2>/dev/null | grep -vq '^\.env\.example$' || find . -maxdepth 3 -name "*.db" | grep -q .; then
            echo "ERROR: Sensitive file (.env*, DEPLOY_ECS.md, or *.db) must never be committed!"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace
