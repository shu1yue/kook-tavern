name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Clippy, Tests & File-Size Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Production Rust file-size hygiene (<= 350 lines)
        run: |
          wc -l crates/*/src/*.rs crates/*/src/*/*.rs | awk '
            $2 != "total" && $1 > 350 { print "ERROR: >350 lines:", $0; err=1 }
            END { if (err) exit 1; print "All production .rs files <= 350 lines." }
          '
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace Tests
        run: cargo test --workspace
