[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/core",
    "crates/infra-sqlite",
    "crates/infra-llm",
    "crates/adapter-kook",
    "crates/adapter-cli",
    "crates/app",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
flate2 = "1"
futures-util = "0.3"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "io-std", "io-util"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tavern-domain = { path = "crates/domain" }
tavern-core = { path = "crates/core" }
tavern-infra-sqlite = { path = "crates/infra-sqlite" }
tavern-infra-llm = { path = "crates/infra-llm" }
tavern-adapter-kook = { path = "crates/adapter-kook" }
tavern-adapter-cli = { path = "crates/adapter-cli" }
