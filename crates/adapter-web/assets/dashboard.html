<!doctype html>
<html lang="zh-CN" data-theme="ember">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🍺 AI 群酒馆 · 实况只读看板</title>
  <style>
    :root, [data-theme="ember"] {
      --bg: #0c0a09;
      --bg-glow: #291a10;
      --surface: #161210;
      --surface-2: #201a16;
      --border: #382c22;
      --accent: #f0b429;
      --accent-soft: rgba(240, 180, 41, 0.14);
      --accent-border: rgba(240, 180, 41, 0.42);
      --text: #f3ece4;
      --muted: #a69582;
      --hp: #f85149;
      --san: #58a6ff;
      --ok: #3fb950;
      --warn: #d29922;
    }
    [data-theme="fog"] {
      --bg: #070b14;
      --bg-glow: #13223b;
      --surface: #0f1726;
      --surface-2: #162135;
      --border: #253654;
      --accent: #79c0ff;
      --accent-soft: rgba(121, 192, 255, 0.13);
      --accent-border: rgba(121, 192, 255, 0.42);
      --text: #e6edf8;
      --muted: #8b9ec0;
    }
    [data-theme="metro"] {
      --bg: #060d0b;
      --bg-glow: #0b2b22;
      --surface: #0d1715;
      --surface-2: #12221f;
      --border: #1e3b35;
      --accent: #34d399;
      --accent-soft: rgba(52, 211, 153, 0.13);
      --accent-border: rgba(52, 211, 153, 0.45);
      --text: #e4f7f0;
      --muted: #7ea89b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top right, var(--bg-glow) 0%, var(--bg) 58%);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      transition: background 0.4s ease;
    }
    .wrap { max-width: 1260px; margin: 0 auto; padding: 18px 16px 40px; }
    .topbar {
      background: linear-gradient(135deg, var(--accent-soft), var(--surface-2));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .title-area h1 { margin: 0 0 8px; font-size: 22px; color: var(--accent); letter-spacing: 0.5px; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--surface-2); border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 999px; font-size: 12px; color: var(--text);
    }
    .pill.live { border-color: rgba(63, 185, 80, 0.45); color: #7ee787; }
    .pill.warn { border-color: rgba(210, 153, 34, 0.5); color: #f2cc60; }
    .pill.accent { border-color: var(--accent-border); color: var(--accent); background: var(--accent-soft); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
    .controls { display: flex; gap: 8px; align-items: center; }
    button.btn {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 7px 12px; font-size: 12px; cursor: pointer;
    }
    button.btn:hover { border-color: var(--accent); color: var(--accent); }
    .act-strip {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .act-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
    .act-step {
      padding: 9px 12px; border-radius: 10px; background: var(--surface-2);
      border: 1px solid var(--border); opacity: 0.62;
    }
    .act-step.done { opacity: 0.92; border-color: rgba(63, 185, 80, 0.4); }
    .act-step.active { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
    .act-step-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .act-step.active .act-step-title { color: var(--accent); }
    .act-step-goal { font-size: 11px; color: var(--muted); line-height: 1.45; }
    .flags-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .ending-banner {
      display: none;
      background: linear-gradient(135deg, rgba(240, 180, 41, 0.22), rgba(210, 153, 34, 0.08));
      border: 1px solid rgba(240, 180, 41, 0.6);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 16px;
      color: #fde68a;
      font-weight: 700;
      font-size: 15px;
    }
    .grid { display: grid; grid-template-columns: 370px 1fr; gap: 18px; align-items: start; }
    @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel h2 {
      margin: 0 0 12px; font-size: 15px; color: var(--accent);
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); padding-bottom: 8px;
    }
    .player-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .player-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .player-name { font-weight: 700; font-size: 15px; }
    .player-role { font-size: 12px; color: var(--muted); }
    .bar-row { display: grid; grid-template-columns: 44px 1fr 48px; gap: 8px; align-items: center; font-size: 12px; margin: 5px 0; }
    .bar-track { height: 8px; background: #0d1117; border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
    .bar-fill { height: 100%; border-radius: 999px; transition: width 0.35s ease; }
    .bar-fill.hp { background: linear-gradient(90deg, #da3633, #ff7b72); }
    .bar-fill.san { background: linear-gradient(90deg, #1f6feb, #79c0ff); }
    .stats-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .stat-badge {
      font-size: 11px; padding: 2px 7px; border-radius: 6px;
      background: rgba(0, 0, 0, 0.28); border: 1px solid var(--border); color: var(--muted);
    }
    .stat-badge.high { border-color: var(--accent-border); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,0.24); border: 1px solid var(--border); color: var(--text); }
    .chip.gold { border-color: var(--accent-border); color: var(--accent); }
    .list-item { padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 8px; font-size: 13px; line-height: 1.5; }
    .list-item.unlocked { border-color: rgba(63, 185, 80, 0.45); }
    .npc-head { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 3px; }
    .turn-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .turn-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
    .turn-title { font-weight: 700; color: var(--accent); font-size: 15px; }
    .turn-meta { font-size: 12px; color: var(--muted); }
    .turn-input {
      font-size: 12px; color: #a5d6ff; background: rgba(88,166,255,0.08);
      border-left: 2px solid var(--san); padding: 6px 10px; border-radius: 6px;
      white-space: pre-wrap; margin-bottom: 10px;
    }
    .turn-story { font-size: 14px; line-height: 1.75; white-space: pre-wrap; color: var(--text); }
    .turn-diff { margin-top: 10px; font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 6px 10px; border-radius: 8px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
    .banner {
      display: none; background: rgba(248, 81, 73, 0.14); border: 1px solid rgba(248, 81, 73, 0.45);
      color: #ffa198; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="banner" class="banner"></div>
    <div id="ending-banner" class="ending-banner"></div>
    <header class="topbar">
      <div class="title-area">
        <h1 id="room-title">🍺 加载冒险战局中…</h1>
        <div class="meta-row" id="room-meta"></div>
      </div>
      <div class="controls">
        <span id="sse-pill" class="pill live"><span id="sse-dot" class="dot"></span><span id="sse-text">实时同步中</span></span>
        <button id="order-btn" class="btn" type="button">最新在顶</button>
        <button id="refresh-btn" class="btn" type="button">↻ 刷新</button>
      </div>
    </header>

    <section id="act-strip" class="act-strip">
      <div id="act-steps" class="act-steps"></div>
      <div id="flags-row" class="flags-row"></div>
    </section>

    <div class="grid">
      <aside>
        <section class="panel">
          <h2><span>⚔️ 冒险小队</span><span id="party-count" class="pill">0 人</span></h2>
          <div id="party-list"></div>
        </section>
        <section class="panel">
          <h2><span>🗣️ 关键 NPC 态度</span><span id="npc-count" class="pill">0</span></h2>
          <div id="npc-list"></div>
        </section>
        <section class="panel">
          <h2><span>🔎 已掌握线索</span><span id="clue-count" class="pill">0</span></h2>
          <div id="clue-list"></div>
        </section>
        <section class="panel" id="gallery-panel" style="display:none">
          <h2><span>🏆 本剧本结局图鉴</span><span id="gallery-count" class="pill">0/0</span></h2>
          <div id="gallery-list"></div>
        </section>
      </aside>

      <main>
        <section class="panel" id="summary-panel" style="display:none">
          <h2><span>📖 前情提要</span><span id="summary-upto" class="pill"></span></h2>
          <div id="summary-body" class="turn-story"></div>
        </section>
        <section class="panel">
          <h2><span>🎭 实况剧情流</span><span id="turn-count" class="pill">序幕</span></h2>
          <div id="story-feed"></div>
        </section>
      </main>
    </div>
  </div>

  <script>
    (function () {
      const m = window.location.pathname.match(/^(.*)\/room\/([^/]+)\/?$/);
      const basePrefix = m ? m[1] : "";
      const rawChannel = m ? m[2] : "";
      let channelId = rawChannel;
      try { channelId = decodeURIComponent(rawChannel); } catch (_) {}
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token") || "";
      let newestFirst = true;
      let lastData = null;
      let es = null;
      let stopped = false;

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

      function setBanner(msg) {
        const b = document.getElementById("banner");
        if (!msg) { b.style.display = "none"; return; }
        b.textContent = msg;
        b.style.display = "block";
      }

      function setLiveState(ok, label) {
        const pill = document.getElementById("sse-pill");
        const dot = document.getElementById("sse-dot");
        const txt = document.getElementById("sse-text");
        pill.className = ok ? "pill live" : "pill warn";
        dot.className = ok ? "dot" : "dot warn";
        txt.textContent = label;
      }

      function fmtMod(v) { return (v >= 0 ? "+" : "") + v; }

      function kindLabel(kind) {
        if (kind === "true") return "🌟 真结局";
        if (kind === "secret") return "🔮 隐藏结局";
        if (kind === "bad") return "💀 坏结局";
        if (kind === "good") return "✨ 佳结局";
        return "📜 普通结局";
      }

      function renderBar(label, cur, max, cls) {
        const row = el("div", "bar-row");
        row.appendChild(el("span", "", label));
        const track = el("div", "bar-track");
        const fill = el("div", "bar-fill " + cls);
        const pct = max > 0 ? Math.max(0, Math.min(100, (cur / max) * 100)) : 0;
        fill.style.width = pct.toFixed(1) + "%";
        track.appendChild(fill);
        row.appendChild(track);
        row.appendChild(el("span", "", cur + "/" + max));
        return row;
      }

      const ALLOWED_THEMES = new Set(["ember", "fog", "metro"]);
      function render(data) {
        lastData = data;
        document.documentElement.dataset.theme = ALLOWED_THEMES.has(data.theme) ? data.theme : "ember";
        document.title = "🍺 " + data.title + " · 实况看板";
        document.getElementById("room-title").textContent = "🎭 《" + data.title + "》";

        const endBanner = document.getElementById("ending-banner");
        if (data.ended_title) {
          endBanner.textContent = "🏆 本局已达成结局：《" + data.ended_title + "》 · 感谢各位冒险者共同谱写的史诗！";
          endBanner.style.display = "block";
        } else {
          endBanner.style.display = "none";
        }

        const meta = document.getElementById("room-meta");
        clear(meta);
        const phaseTxt = data.ended_title ? "🏆 剧终收束" : (data.turn_phase === "resolving" ? "⏳ DM 推演中…" : "🟢 等待行动");
        const modeTxt = data.chat_mode === "roleplay" ? "💬 直接说话" : "⌨️ 指令前缀";
        const styleTxt = data.narrative_style === "voice" ? "🎙️ 语音极简" : "📖 文字沉浸";
        [
          "📍 " + data.location,
          "🕒 " + data.world_time,
          "🎲 第 " + data.turn_number + " 回合",
          phaseTxt,
          modeTxt,
          styleTxt
        ].forEach(t => meta.appendChild(el("span", "pill", t)));

        // Act stepper & world flags
        const strip = document.getElementById("act-strip");
        const stepsEl = document.getElementById("act-steps");
        const flagsEl = document.getElementById("flags-row");
        clear(stepsEl);
        clear(flagsEl);
        const acts = data.acts || [];
        const flags = data.world_flags || [];
        if (acts.length || flags.length) {
          strip.style.display = "block";
          acts.forEach(a => {
            const cls = a.index < data.current_act || data.ended_title
              ? "act-step done"
              : (a.index === data.current_act ? "act-step active" : "act-step");
            const box = el("div", cls);
            const prefix = a.index < data.current_act || data.ended_title ? "✅ " : (a.index === data.current_act ? "🎬 " : "🔒 ");
            box.appendChild(el("div", "act-step-title", prefix + "第 " + a.index + " 幕 · " + a.title));
            box.appendChild(el("div", "act-step-goal", a.goal));
            stepsEl.appendChild(box);
          });
          flags.forEach(f => flagsEl.appendChild(el("span", "pill accent", "🚩 " + f)));
        } else {
          strip.style.display = "none";
        }

        // Party
        const partyEl = document.getElementById("party-list");
        clear(partyEl);
        document.getElementById("party-count").textContent = data.players.length + " 人";
        if (!data.players.length) {
          partyEl.appendChild(el("div", "empty", "暂无已入团角色，请在 KOOK 频道点「🎭 选职业入团」或直接发消息！"));
        } else {
          data.players.forEach(p => {
            const card = el("div", "player-card");
            const head = el("div", "player-head");
            const left = el("div");
            left.appendChild(el("div", "player-name", p.character_name));
            left.appendChild(el("div", "player-role", p.role_desc + (p.status_note ? " · " + p.status_note : "")));
            const badge = p.is_afk ? "💤 暂离" : (p.action_ready ? "✅ 已就绪" : "⏳ 思考中");
            head.appendChild(left);
            head.appendChild(el("span", "pill" + (p.action_ready ? " live" : ""), badge));
            card.appendChild(head);
            card.appendChild(renderBar("❤️ HP", p.hp, p.max_hp, "hp"));
            card.appendChild(renderBar("🧠 SAN", p.san, p.max_san, "san"));
            if (p.stats) {
              const sRow = el("div", "stats-row");
              [
                ["💪体", p.stats.body], ["🏃敏", p.stats.agility],
                ["🔍侦", p.stats.investigate], ["🗣️交", p.stats.social], ["✨灵", p.stats.insight]
              ].forEach(([lbl, val]) => {
                sRow.appendChild(el("span", "stat-badge" + (val >= 2 ? " high" : ""), lbl + fmtMod(val || 0)));
              });
              card.appendChild(sRow);
            }
            const chips = el("div", "chips");
            (p.traits || []).forEach(tr => chips.appendChild(el("span", "chip gold", "✦ " + tr)));
            (p.inventory || []).forEach(it => chips.appendChild(el("span", "chip", "🎒 " + it)));
            (p.roll_notes || []).forEach(rn => chips.appendChild(el("span", "chip gold", rn)));
            if (chips.childNodes.length) card.appendChild(chips);
            partyEl.appendChild(card);
          });
        }

        // NPCs
        const npcEl = document.getElementById("npc-list");
        clear(npcEl);
        document.getElementById("npc-count").textContent = String(data.npc_states.length);
        if (!data.npc_states.length) {
          npcEl.appendChild(el("div", "empty", "尚未触发关键 NPC 态度变化。"));
        } else {
          data.npc_states.forEach(n => {
            const item = el("div", "list-item");
            const nh = el("div", "npc-head");
            nh.appendChild(el("span", "", n.name));
            nh.appendChild(el("span", "pill", n.attitude || "中立"));
            item.appendChild(nh);
            if (n.status) item.appendChild(el("div", "player-role", n.status));
            npcEl.appendChild(item);
          });
        }

        // Clues
        const clueEl = document.getElementById("clue-list");
        clear(clueEl);
        document.getElementById("clue-count").textContent = String(data.clues.length);
        if (!data.clues.length) {
          clueEl.appendChild(el("div", "empty", "尚未发现明确线索。"));
        } else {
          data.clues.forEach((c, i) => clueEl.appendChild(el("div", "list-item", (i + 1) + ". " + c)));
        }

        // Ending Gallery
        const galPanel = document.getElementById("gallery-panel");
        const galList = document.getElementById("gallery-list");
        clear(galList);
        const gallery = data.ending_gallery || [];
        if (gallery.length) {
          galPanel.style.display = "block";
          const got = gallery.filter(g => g.unlocked).length;
          document.getElementById("gallery-count").textContent = got + "/" + gallery.length;
          gallery.forEach(g => {
            const item = el("div", "list-item" + (g.unlocked ? " unlocked" : ""));
            const head = el("div", "npc-head");
            head.appendChild(el("span", "", (g.unlocked ? "✅ " : "🔒 ") + g.title));
            head.appendChild(el("span", "pill" + (g.unlocked ? " live" : ""), kindLabel(g.kind)));
            item.appendChild(head);
            if (g.unlocked && g.turn_count !== null) {
              item.appendChild(el("div", "player-role", "本服已解锁 · 历时 " + g.turn_count + " 回合"));
            }
            galList.appendChild(item);
          });
        } else {
          galPanel.style.display = "none";
        }

        // Summary
        const sumPanel = document.getElementById("summary-panel");
        if (data.summary && data.summary.trim()) {
          sumPanel.style.display = "block";
          document.getElementById("summary-upto").textContent = "已压缩至第 " + data.summary_upto_turn + " 回合";
          document.getElementById("summary-body").textContent = data.summary;
        } else {
          sumPanel.style.display = "none";
        }

        // Story feed
        const feed = document.getElementById("story-feed");
        clear(feed);
        document.getElementById("turn-count").textContent = "共 " + data.turns.length + " 幕";
        const items = [];
        if (data.opening_scene) {
          items.push({
            turn_number: 0,
            scene_title: data.title + " · 序幕",
            location: data.location,
            world_time: "开局",
            batched_input: "",
            narrative: data.opening_scene,
            state_summary: ""
          });
        }
        data.turns.forEach(t => items.push(t));
        if (newestFirst) items.reverse();
        items.forEach(t => {
          const card = el("article", "turn-card");
          const h = el("div", "turn-head");
          h.appendChild(el("div", "turn-title", (t.turn_number === 0 ? "🕯️ " : "第 " + t.turn_number + " 幕 · ") + t.scene_title));
          h.appendChild(el("div", "turn-meta", t.location + " ｜ " + t.world_time));
          card.appendChild(h);
          if (t.batched_input) card.appendChild(el("div", "turn-input", t.batched_input));
          card.appendChild(el("div", "turn-story", t.narrative));
          if (t.state_summary) card.appendChild(el("div", "turn-diff", "⚡ 状态变动：" + t.state_summary));
          feed.appendChild(card);
        });
      }

      function stopLive(label, bannerMsg) {
        stopped = true;
        if (es) { es.close(); es = null; }
        setLiveState(false, label);
        if (bannerMsg) setBanner(bannerMsg);
      }

      async function fetchState() {
        const url = basePrefix + "/api/room/" + encodeURIComponent(channelId) + "?token=" + encodeURIComponent(token);
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (res.status === 403) {
            stopLive("已失效", "🔒 访问凭证已失效或房间已被结团清空，请在 KOOK 重新点「🌐 Web 看板」获取新链接。");
            return;
          }
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          setBanner("");
          render(data);
        } catch (err) {
          if (!stopped) setLiveState(false, "等待重连");
        }
      }

      function connectSse() {
        if (stopped) return;
        const url = basePrefix + "/api/room/" + encodeURIComponent(channelId) + "/events?token=" + encodeURIComponent(token);
        es = new EventSource(url);
        es.onopen = () => { if (!stopped) setLiveState(true, "实时同步中"); };
        es.addEventListener("update", () => { if (!stopped) fetchState(); });
        es.addEventListener("reset", () => {
          stopLive("已结团", "🧹 本局已在 KOOK 结团清空，看板已停止更新。开新团后点击「🌐 Web 看板」即可查看新局！");
        });
        es.onerror = () => { if (!stopped) setLiveState(false, "自动重连中…"); };
      }

      document.getElementById("refresh-btn").addEventListener("click", fetchState);
      document.getElementById("order-btn").addEventListener("click", (e) => {
        newestFirst = !newestFirst;
        e.target.textContent = newestFirst ? "最新在顶" : "时间正序";
        if (lastData) render(lastData);
      });

      fetchState();
      connectSse();
    })();
  </script>
</body>
</html>
