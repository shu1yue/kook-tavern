<!doctype html>
<html lang="zh-CN" data-theme="ember">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>🪟 冒险者悬浮 HUD · AI 群酒馆</title>
  <style id="hud-styles">
    :root, [data-theme="ember"] {
      --bg: #0c0a09; --bg-glow: #26180e; --surface: #15110f; --surface-2: #1f1915;
      --border: #33271e; --accent: #f0b429; --accent-soft: rgba(240, 180, 41, 0.13);
      --accent-border: rgba(240, 180, 41, 0.42); --text: #f3ece4; --muted: #9e8d7b;
      --hp: #f85149; --san: #58a6ff; --ally: #3fb950; --neutral: #d29922;
      --wary: #f0883e; --hostile: #f85149; --whisper: #c084fc;
      --whisper-soft: rgba(192, 132, 252, 0.12);
    }
    [data-theme="fog"] {
      --bg: #070b14; --bg-glow: #122038; --surface: #0e1624; --surface-2: #152033;
      --border: #23334f; --accent: #79c0ff; --accent-soft: rgba(121, 192, 255, 0.13);
      --accent-border: rgba(121, 192, 255, 0.42); --text: #e6edf8; --muted: #8699ba;
    }
    [data-theme="metro"] {
      --bg: #060d0b; --bg-glow: #0b2820; --surface: #0d1715; --surface-2: #12211e;
      --border: #1c3630; --accent: #34d399; --accent-soft: rgba(52, 211, 153, 0.13);
      --accent-border: rgba(52, 211, 153, 0.42); --text: #e4f7f0; --muted: #7aa396;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: radial-gradient(circle at top right, var(--bg-glow) 0%, var(--bg) 65%);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      font-size: 13px; line-height: 1.55;
    }
    #hud-root {
      max-width: 460px; height: 100vh; margin: 0 auto;
      display: flex; flex-direction: column;
      background: rgba(12, 10, 9, 0.3);
    }
    /* Ultra-slim 46px Topbar */
    .topbar {
      height: 46px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 0 12px;
      background: rgba(21, 17, 15, 0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .top-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--ally); box-shadow: 0 0 6px var(--ally); }
    .dot.warn { background: var(--neutral); box-shadow: 0 0 6px var(--neutral); animation: blink 1s infinite; }
    .dot.err { background: var(--hostile); box-shadow: 0 0 6px var(--hostile); }
    @keyframes blink { 50% { opacity: 0.35; } }
    .top-turn { font-weight: 700; font-size: 13px; color: var(--accent); white-space: nowrap; }
    .top-vitals {
      font-size: 11px; color: var(--muted); white-space: nowrap;
      padding: 2px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border);
    }
    .top-vitals strong { color: var(--text); font-weight: 700; }
    .top-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .mini-btn {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 8px; font-size: 11px; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 3px; white-space: nowrap;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .mini-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .mini-btn.pip-on { border-color: var(--ally); color: #7ee787; background: rgba(63,185,80,0.14); }
    /* Toast */
    .toast {
      display: none; flex-shrink: 0; margin: 8px 12px 0; padding: 7px 11px; border-radius: 10px;
      background: var(--accent-soft); border: 1px solid var(--accent-border);
      font-size: 12px; color: var(--accent);
    }
    /* Main Scroll Viewport (85%+ height!) */
    .page-body {
      flex: 1; overflow-y: auto; padding: 14px 14px 18px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .page-hd {
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      margin-bottom: 12px;
    }
    .page-title { font-size: 15px; font-weight: 800; color: var(--text); margin: 0; }
    .page-sub { font-size: 11px; color: var(--muted); }
    /* Clean Cards */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 13px; padding: 13px 14px; margin-bottom: 12px;
    }
    .card.focus {
      background: linear-gradient(135deg, var(--accent-soft), var(--surface));
      border-color: var(--accent-border);
    }
    .label {
      font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.3px;
      margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    /* Hero Identity on Me Page */
    .id-row { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), #b45309);
      color: #140e08; font-weight: 800; font-size: 17px;
      display: grid; place-items: center;
    }
    .id-name { font-size: 16px; font-weight: 800; color: var(--text); }
    .id-meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .vitals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .bar-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--muted); }
    .bar-head strong { color: var(--text); }
    .track { height: 8px; border-radius: 999px; background: rgba(0,0,0,0.45); overflow: hidden; }
    .fill { height: 100%; border-radius: 999px; transition: width 0.35s ease; }
    .fill.hp { background: linear-gradient(90deg, #dc2626, #f87171); }
    .fill.san { background: linear-gradient(90deg, #2563eb, #60a5fa); }
    .stats-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .stat-tile {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 2px; text-align: center;
    }
    .stat-tile .k { font-size: 10px; color: var(--muted); }
    .stat-tile .v { font-size: 16px; font-weight: 800; margin-top: 2px; }
    .stat-tile .v.pos { color: var(--ally); }
    .stat-tile .v.neg { color: var(--hostile); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 12px; padding: 4px 10px; border-radius: 999px;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    }
    .chip.sm { font-size: 11px; padding: 2px 8px; }
    .chip.accent { border-color: var(--accent-border); color: var(--accent); background: var(--accent-soft); }
    .chip.ally { border-color: rgba(63,185,80,0.45); color: #7ee787; background: rgba(63,185,80,0.12); }
    .chip.neutral { border-color: rgba(210,153,34,0.45); color: #f2cc60; background: rgba(210,153,34,0.12); }
    .chip.wary { border-color: rgba(240,136,62,0.5); color: #fdba74; background: rgba(240,136,62,0.12); }
    .chip.hostile { border-color: rgba(248,81,73,0.5); color: #fca5a5; background: rgba(248,81,73,0.12); }
    .ability-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; border-radius: 10px; background: var(--surface-2); margin-bottom: 6px;
    }
    /* Whispers Page */
    .whisper-card {
      background: linear-gradient(135deg, var(--whisper-soft), var(--surface));
      border: 1px solid rgba(192,132,252,0.35); border-left: 3px solid var(--whisper);
      border-radius: 12px; padding: 12px 13px; margin-bottom: 10px;
    }
    .whisper-card.latest { box-shadow: 0 0 18px rgba(192,132,252,0.16); border-color: rgba(192,132,252,0.6); }
    .whisper-hd { font-size: 11px; color: #d8b4fe; font-weight: 700; margin-bottom: 5px; display: flex; justify-content: space-between; }
    .whisper-txt { font-size: 13px; color: var(--text); white-space: pre-line; }
    /* Relationships Page */
    .graph-box {
      background: radial-gradient(circle at center, rgba(255,255,255,0.03), rgba(0,0,0,0.38));
      border: 1px solid var(--border); border-radius: 13px; overflow: hidden; margin-bottom: 12px;
    }
    .graph-svg { width: 100%; height: auto; display: block; }
    .g-node { cursor: pointer; }
    .g-node:hover circle { filter: brightness(1.25); }
    .acc-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 8px; overflow: hidden;
      transition: border-color 0.2s;
    }
    .acc-item.open { border-color: var(--accent-border); }
    .acc-head {
      padding: 10px 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .acc-name { font-weight: 700; font-size: 13px; }
    .acc-brief { font-size: 12px; color: var(--muted); padding: 0 12px 10px; margin-top: -4px; }
    .acc-detail {
      padding: 10px 12px 12px; border-top: 1px solid var(--border);
      background: var(--surface-2); font-size: 12px;
    }
    .acc-detail ul { margin: 4px 0 8px; padding-left: 16px; }
    .acc-detail li { margin-bottom: 4px; }
    /* Goal Page & Blades-in-the-Dark SVG Clocks */
    .goal-title { font-size: 15px; font-weight: 800; color: var(--accent); margin-bottom: 5px; }
    .goal-desc { font-size: 13px; color: var(--text); }
    .clocks-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
    .clock-tile {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 11px;
      background: var(--surface-2); border: 1px solid var(--border);
    }
    .clock-tile.threat.hot { border-color: rgba(248, 81, 73, 0.65); background: rgba(248, 81, 73, 0.09); }
    .clock-tile.progress.hot { border-color: rgba(63, 185, 80, 0.65); background: rgba(63, 185, 80, 0.09); }
    .clock-svg { width: 48px; height: 48px; flex-shrink: 0; }
    .clock-meta { min-width: 0; flex: 1; }
    .clock-name { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .clock-sub { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
    .clock-sub.danger { color: #fca5a5; font-weight: 700; }
    .clock-sub.done { color: #7ee787; font-weight: 700; }
    .act-pill {
      padding: 9px 11px; border-radius: 10px; background: var(--surface-2);
      border: 1px solid var(--border); margin-bottom: 7px; font-size: 12.5px;
      display: flex; gap: 8px; align-items: flex-start;
    }
    .act-num { color: var(--accent); font-weight: 800; flex-shrink: 0; }
    .roll-box {
      padding: 9px 12px; border-radius: 10px; margin-bottom: 12px;
      background: rgba(63, 185, 80, 0.12); border: 1px solid rgba(63, 185, 80, 0.42);
      color: #a7f3d0; font-size: 12px;
    }
    .clue-row {
      padding: 8px 10px; border-radius: 9px; background: var(--surface-2);
      margin-bottom: 6px; font-size: 12.5px;
    }
    .link-btn {
      width: 100%; background: var(--surface-2); color: var(--accent);
      border: 1px dashed var(--accent-border); border-radius: 9px;
      padding: 7px; font-size: 12px; cursor: pointer; margin-top: 4px;
    }
    /* Codex Page */
    .search-wrap { position: relative; margin-bottom: 10px; }
    .search-wrap input {
      width: 100%; background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 11px;
      padding: 9px 32px 9px 12px; font-size: 13px; outline: none;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-x {
      display: none; position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px;
    }
    .subpills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
    .subpill {
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
      border-radius: 9px; padding: 6px 4px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .subpill.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .muted { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); text-align: center; padding: 28px 12px; font-size: 13px; }
    .pulse-ring { transform-box: fill-box; transform-origin: center; animation: pulseRing 2.2s ease-out infinite; }
    @keyframes pulseRing {
      0% { opacity: 0.85; transform: scale(1); }
      75% { opacity: 0.08; transform: scale(1.65); }
      100% { opacity: 0; transform: scale(1.8); }
    }
    /* Fixed 5-Tab Bottom App Navigation */
    .bottom-nav {
      height: 56px; flex-shrink: 0;
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: rgba(21, 17, 15, 0.96); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 4px 4px 6px;
    }
    .nav-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; border-radius: 10px; position: relative; padding: 2px 0;
      transition: color 0.18s, background 0.18s;
    }
    .nav-btn .ico { font-size: 17px; line-height: 1; }
    .nav-btn .txt { font-size: 10px; font-weight: 600; }
    .nav-btn.active { color: var(--accent); background: var(--accent-soft); }
    .nav-dot {
      display: none; position: absolute; top: 3px; right: 14%;
      min-width: 15px; height: 15px; line-height: 15px; padding: 0 4px;
      border-radius: 999px; font-size: 9px; font-weight: 800;
      background: var(--whisper); color: #160924;
    }
    .nav-dot.show { display: inline-block; }
    .nav-dot.subtle { background: rgba(255,255,255,0.15); color: var(--text); font-weight: 600; }
    .pip-hold {
      display: none; min-height: 100vh; place-items: center; padding: 24px; text-align: center;
    }
    .pip-hold.show { display: grid; }
  </style>
</head>
<body>
  <div id="pip-hold" class="pip-hold">
    <div class="card" style="max-width:320px">
      <div class="goal-title">📌 悬浮角色卡已置顶弹出</div>
      <p class="muted">正在独立画中画置顶窗中实时同步。关闭浮窗后会自动回到这里喵！</p>
      <button class="mini-btn" id="btn-pip-back">↩️ 收回主页面</button>
    </div>
  </div>
  <div id="hud-root">
    <header class="topbar">
      <div class="top-left">
        <span class="dot" id="live-dot"></span>
        <span class="top-turn" id="top-turn">连接中…</span>
        <span class="top-vitals" id="top-vitals">❤️ - ｜ 🧠 -</span>
      </div>
      <div class="top-right">
        <button class="mini-btn" id="btn-pip" title="弹出置顶悬浮窗">📌 浮窗</button>
        <a class="mini-btn" id="btn-dash" href="#" target="_blank" rel="noopener" title="打开全队 Web 大屏">🌐</a>
      </div>
    </header>
    <div class="toast" id="toast"></div>
    <main class="page-body" id="page-body">
      <div class="empty">正在拉取你的专属冒险档案…</div>
    </main>
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-btn active" data-page="me"><span class="ico">🪪</span><span class="txt">角色</span></button>
      <button class="nav-btn" data-page="whispers"><span class="ico">🤫</span><span class="txt">纸条</span><span class="nav-dot" id="dot-w"></span></button>
      <button class="nav-btn" data-page="rel"><span class="ico">🤝</span><span class="txt">人物</span><span class="nav-dot subtle" id="dot-r"></span></button>
      <button class="nav-btn" data-page="goal"><span class="ico">🎯</span><span class="txt">目标</span></button>
      <button class="nav-btn" data-page="codex"><span class="ico">📖</span><span class="txt">百科</span></button>
    </nav>
  </div>
<script>
(() => {
  const parts = location.pathname.split('/').filter(Boolean);
  const channelId = decodeURIComponent(parts[parts.length - 1] || '');
  const params = new URLSearchParams(location.search);
  const uid = params.get('u') || '';
  const ptoken = params.get('ptoken') || '';
  const qs = `u=${encodeURIComponent(uid)}&ptoken=${encodeURIComponent(ptoken)}`;
  const apiUrl = `/api/hud/${encodeURIComponent(channelId)}?${qs}`;
  const sseUrl = `/api/hud/${encodeURIComponent(channelId)}/events?${qs}`;

  let state = null;
  let page = 'me';
  let codexSub = 'map';
  let openNpcKey = null;
  let showAllClues = false;
  let searchQ = '';
  let seenWhispers = null;
  let unreadWhispers = 0;
  let pipWin = null;

  const $ = (id) => (pipWin && !pipWin.closed ? pipWin.document.getElementById(id) : null) || document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const cut = (s, n) => Array.from(String(s ?? '')).slice(0, n).join('');
  const fmtMod = (v) => (v >= 0 ? `+${v}` : `${v}`);
  const tierColor = (t) => ({ ally: '#3fb950', neutral: '#d29922', wary: '#f0883e', hostile: '#f85149' }[t] || '#d29922');

  function toast(msg, ms = 4500) {
    const el = $('toast');
    if (!el) return;
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, ms);
  }

  function setDot(mode) {
    const d = $('live-dot');
    if (d) d.className = 'dot' + (mode === 'warn' ? ' warn' : mode === 'err' ? ' err' : '');
  }

  async function fetchHud() {
    try {
      const res = await fetch(apiUrl, { cache: 'no-store' });
      if (!res.ok) {
        setDot('err');
        $('page-body').innerHTML = '<div class="empty">🔒 本局已结团或你已离桌，回 KOOK 点「🪪 我的角色卡」获取新链接喵。</div>';
        return;
      }
      const next = await res.json();
      const wc = (next.me.whispers || []).length;
      if (seenWhispers === null) {
        seenWhispers = wc;
      } else if (wc > seenWhispers) {
        const diff = wc - seenWhispers;
        if (page !== 'whispers') unreadWhispers += diff;
        seenWhispers = wc;
        toast(`🤫 收到 ${diff} 条新秘密纸条！点底部「🤫 纸条」查看`, 6000);
      } else if (wc < seenWhispers) {
        seenWhispers = wc;
        unreadWhispers = 0;
      }
      state = next;
      render();
    } catch (_) {
      setDot('err');
    }
  }

  function render() {
    if (!state) return;
    const theme = state.theme || 'ember';
    document.documentElement.setAttribute('data-theme', theme);
    if (pipWin && !pipWin.closed) pipWin.document.documentElement.setAttribute('data-theme', theme);

    setDot(state.turn_phase === 'resolving' ? 'warn' : 'ok');
    $('top-turn').textContent = state.turn_phase === 'resolving'
      ? `第 ${state.turn_number} 轮 · 推演中`
      : `第 ${state.turn_number} 轮`;
    const m = state.me;
    $('top-vitals').innerHTML = `❤️<strong>${m.hp}</strong>/${m.max_hp} ｜ 🧠<strong>${m.san}</strong>/${m.max_san}${m.inspiration ? ' 🌟' : ''}`;
    const dash = $('btn-dash');
    if (dash && state.dashboard_path) dash.href = state.dashboard_path;

    // Nav badges
    const dw = $('dot-w');
    const wTotal = (m.whispers || []).length;
    if (unreadWhispers > 0) {
      dw.textContent = `+${unreadWhispers}`;
      dw.className = 'nav-dot show';
    } else if (wTotal > 0) {
      dw.textContent = String(wTotal);
      dw.className = 'nav-dot show subtle';
    } else {
      dw.className = 'nav-dot';
    }
    const dr = $('dot-r');
    const nTotal = (state.npcs || []).length;
    if (nTotal > 0) {
      dr.textContent = String(nTotal);
      dr.className = 'nav-dot show subtle';
    } else {
      dr.className = 'nav-dot';
    }

    const nav = $('bottom-nav');
    if (nav) nav.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-page') === page));

    if (page === 'me') renderMe();
    else if (page === 'whispers') renderWhispers();
    else if (page === 'rel') renderRel();
    else if (page === 'goal') renderGoal();
    else renderCodex();
  }

  function renderMe() {
    const m = state.me;
    const hpPct = Math.max(0, Math.min(100, Math.round((m.hp / Math.max(1, m.max_hp)) * 100)));
    const sanPct = Math.max(0, Math.min(100, Math.round((m.san / Math.max(1, m.max_san)) * 100)));
    const stats = [
      ['体魄', m.stats.body], ['敏捷', m.stats.agility],
      ['侦查', m.stats.investigate], ['交涉', m.stats.social], ['灵感', m.stats.insight]
    ];

    let html = `
      <div class="card focus">
        <div class="id-row">
          <div class="avatar">${esc(cut(m.character_name || '冒', 1))}</div>
          <div style="min-width:0;flex:1">
            <div class="id-name">${esc(m.character_name)} <span class="chip sm accent">${esc(m.role_desc || '冒险者')} Lv.${m.level || 1}</span></div>

          <div>

          </div>
          <div>
            <div class="bar-head"><span>🧠 理智</span><strong>${m.san} / ${m.max_san}</strong></div>
            <div class="track"><div class="fill san" style="width:${sanPct}%"></div></div>

      <div class="card">
        <div class="label"><span>📊 五维属性</span><span>${esc(state.check_system)}</span></div>
        <div class="stats-5">
          ${stats.map(([k, v]) => `<div class="stat-tile"><div class="k">${k}</div><div class="v ${v>0?'pos':v<0?'neg':''}">${fmtMod(v)}</div></div>`).join('')}
        </div>
        ${(m.traits.length || (m.proficient_skills||[]).length) ? `<div class="chips" style="margin-top:10px">${m.traits.map(t => `<span class="chip sm accent">✦ ${esc(t)}</span>`).join('')}${(m.proficient_skills||[]).map(s => `<span class="chip sm">🎯 ${esc(s)}</span>`).join('')}</div>` : ''}
      </div>`;

          const pips = '●'.repeat(a.uses_left) + '○'.repeat(Math.max(0, a.max_uses - a.uses_left));
          return `<div class="ability-row"><strong>${esc(a.name)}</strong><span class="chip sm accent">${pips} ${a.uses_left}/${a.max_uses} · ${esc(a.recharge)}</span></div>`;

  function renderWhispers() {

        <div class="whisper-card ${idx === 0 ? 'latest' : ''}">

          <div class="whisper-txt">${esc(w.content)}</div>

  function renderRel() {
    const npcs = state.npcs || [];
    const mates = (state.party || []).filter(p => !p.is_me);
    const nodes = [
      ...mates.map((p, i) => ({ kind: 'mate', key: `mate:${i}`, name: p.character_name, sub: '队友', tier: 'mate', data: p })),
      ...npcs.map((n, i) => ({ kind: 'npc', key: `npc:${i}`, name: n.name, sub: n.attitude, tier: n.attitude_tier, data: n }))
    ];

    let html = `<div class="page-hd"><h2 class="page-title">🤝 人物与关系</h2><span class="page-sub">点任意人名展开关联情报</span></div>`;

    if (nodes.length) {
      const cx = 180, cy = 104, rx = 122, ry = 74;
      let edges = '', circles = '';
      nodes.forEach((n, idx) => {
        const ang = -Math.PI / 2 + (idx * 2 * Math.PI) / nodes.length;
        const x = cx + rx * Math.cos(ang), y = cy + ry * Math.sin(ang);
        const col = n.kind === 'mate' ? '#38bdf8' : tierColor(n.tier);
        const sel = openNpcKey === n.key;
        edges += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${col}" stroke-opacity="${sel ? 0.95 : 0.45}" stroke-width="${sel ? 2.5 : 1.5}" ${n.kind === 'mate' ? 'stroke-dasharray="4 3"' : ''}/>`;
        edges += `<text x="${((cx+x)/2).toFixed(1)}" y="${((cy+y)/2 - 3).toFixed(1)}" text-anchor="middle" fill="${col}" font-size="9">${esc(cut(n.sub, 4))}</text>`;
        circles += `<g class="g-node" data-toggle="${esc(n.key)}">` +
          (sel ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="21" fill="none" stroke="${col}" stroke-width="2" class="pulse-ring"/>` : '') +
          `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="#181310" stroke="${col}" stroke-width="${sel ? 2.4 : 1.6}"/>` +
          `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" fill="#f3ece4" font-size="10.5" font-weight="700">${esc(cut(n.name, 3))}</text>` +
          `<text x="${x.toFixed(1)}" y="${(y+28).toFixed(1)}" text-anchor="middle" fill="#cbd5e1" font-size="9.5">${esc(cut(n.name, 6))}</text>` +
          `</g>`;
      });
      html += `<div class="graph-box"><svg class="graph-svg" viewBox="0 0 360 212">
        ${edges}
        <circle cx="${cx}" cy="${cy}" r="22" fill="#2a1c0e" stroke="var(--accent)" stroke-width="2.4"/>
        <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="var(--accent)" font-size="11" font-weight="800">${esc(cut(state.me.character_name, 4))}</text>
        ${circles}
      </svg></div>`;
    }

    if (!nodes.length) {
      html += `<div class="empty">目前还没有遇上关键 NPC 或其他队友。<br/>和人搭话推进剧情后，TA 们的头像、态度与关联线索会自动出现在这里喵！</div>`;
    }

    if (npcs.length) {
      html += `<div class="label" style="margin:6px 2px 8px"><span>已登场人物（${npcs.length}）</span><span>🟢信任 🟡中立 🟠警惕 🔴敌对</span></div>`;
      html += npcs.map((n, i) => {
        const key = `npc:${i}`;
        const isOpen = openNpcKey === key;
        const relCount = n.related_clues.length + n.related_whispers.length + n.related_bulletins.length;
        return `<div class="acc-item ${isOpen ? 'open' : ''}">
          <div class="acc-head" data-toggle="${key}">
            <span class="acc-name">${isOpen ? '▾' : '▸'} ${esc(n.name)}</span>
            <span class="chip sm ${esc(n.attitude_tier)}">${esc(n.attitude)}${relCount ? ` · ${relCount}条关联` : ''}</span>
          </div>
          <div class="acc-brief">${esc(n.status || '观察局势中')}</div>
          ${isOpen ? `<div class="acc-detail">
            ${n.related_clues.length ? `<div style="color:var(--accent);font-weight:700">🔎 相关线索</div><ul>${n.related_clues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
            ${n.related_whispers.length ? `<div style="color:var(--whisper);font-weight:700">🤫 相关密语</div><ul>${n.related_whispers.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
            ${n.related_bulletins.length ? `<div style="color:var(--neutral);font-weight:700">📰 相关号外</div><ul>${n.related_bulletins.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
            ${!relCount ? `<div class="muted">暂无与 ${esc(n.name)} 直接关联的额外线索。</div>` : ''}
          </div>` : ''}
        </div>`;
      }).join('');
    }

    if (mates.length) {
      html += `<div class="label" style="margin:12px 2px 8px"><span>同行队友（${mates.length}）</span><span>实时状态</span></div>`;
      html += mates.map((p, i) => {
        const key = `mate:${i}`;
        const isOpen = openNpcKey === key;
        return `<div class="acc-item ${isOpen ? 'open' : ''}">
          <div class="acc-head" data-toggle="${key}">
            <span class="acc-name">${isOpen ? '▾' : '▸'} ${esc(p.character_name)}</span>
            <span class="chip sm accent">${esc(p.role_desc)}</span>
          </div>
          <div class="acc-brief">❤️ ${p.hp}/${p.max_hp} ｜ 🧠 ${p.san}/${p.max_san} ｜ 📍 ${esc(p.location)}</div>
          ${isOpen ? `<div class="acc-detail">
            ${p.traits.length ? `<div class="chips" style="margin-bottom:6px">${p.traits.map(t => `<span class="chip sm">✦ ${esc(t)}</span>`).join('')}</div>` : ''}
            <div class="muted">${esc(p.status_note || (p.action_ready ? '✅ 本轮已提交行动' : '⏳ 等待行动中'))}</div>
          </div>` : ''}
        </div>`;
      }).join('');
    }

    $('page-body').innerHTML = html;
    $('page-body').querySelectorAll('[data-toggle]').forEach((el) => {
      el.addEventListener('click', () => {
        const k = el.getAttribute('data-toggle');
        openNpcKey = (openNpcKey === k) ? null : k;
        renderRel();
      });
    });
  }

  function renderClockWheel(c) {
    const segs = Math.max(3, Math.min(12, Number(c.segments) || 6));
    const filled = Math.max(0, Math.min(segs, Number(c.filled) || 0));
    const isThreat = c.kind === 'threat';
    const fillCol = isThreat ? '#f85149' : '#3fb950';
    const trackCol = 'rgba(255,255,255,0.07)';
    const cx = 26, cy = 26, r = 22;
    let wedges = '';
    for (let i = 0; i < segs; i++) {
      const a0 = -Math.PI / 2 + (i * 2 * Math.PI) / segs;
      const a1 = -Math.PI / 2 + ((i + 1) * 2 * Math.PI) / segs;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      const d = `M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
      wedges += `<path d="${d}" fill="${i < filled ? fillCol : trackCol}" stroke="#15110f" stroke-width="1.8"/>`;
    }
    const hot = filled >= segs || filled + 1 >= segs;
    const subCls = filled >= segs ? (isThreat ? 'danger' : 'done') : '';
    const subTxt = filled >= segs
      ? (isThreat ? '🚨 已满·危机爆发' : '🎉 已满·破局就绪')
      : `${isThreat ? '威胁钟' : '进度钟'} ${filled}/${segs}${c.auto_tick_every ? ` · 每${c.auto_tick_every}轮+1` : ''}`;
    return `<div class="clock-tile ${isThreat ? 'threat' : 'progress'} ${hot ? 'hot' : ''}">
      <svg class="clock-svg" viewBox="0 0 52 52" aria-label="${esc(c.name)} ${filled}/${segs}">
        <circle cx="${cx}" cy="${cy}" r="${r + 1.2}" fill="none" stroke="${hot ? fillCol : 'var(--border)'}" stroke-width="1.4" opacity="0.8"/>
        ${wedges}
        <circle cx="${cx}" cy="${cy}" r="9" fill="#15110f"/>
        <text x="${cx}" y="${cy + 3.2}" text-anchor="middle" fill="${hot ? fillCol : '#f3ece4'}" font-size="8.5" font-weight="800">${filled}/${segs}</text>
      </svg>
      <div class="clock-meta">
        <div class="clock-name">${esc(c.name)}</div>
        <div class="clock-sub ${subCls}">${esc(subTxt)}</div>
      </div>
    </div>`;
  }

  function renderGoal() {
    const acts = state.acts || [];
    const curAct = acts.find(a => a.index === state.current_act) || acts[0];
    const m = state.me;
    let html = `<div class="page-hd"><h2 class="page-title">🎯 下一步目标</h2><span class="page-sub">🕒 ${esc(state.world_time)}</span></div>`;

    if (m.roll_notes.length || m.action_ready || m.is_afk) {
      const parts = [];
      if (m.roll_notes.length) parts.push(`🎲 本轮检定：${m.roll_notes[m.roll_notes.length - 1]}`);
      if (m.action_ready && m.pending_action_text) parts.push(`✅ 已提交行动：${m.pending_action_text}`);
      else if (m.is_afk) parts.push('💤 暂离中');
      html += `<div class="roll-box">${esc(parts.join(' ｜ '))}</div>`;
    }

    if (curAct) {
      html += `<div class="card focus">
        <div class="label"><span>🎬 第 ${curAct.index} / ${acts.length} 幕主线</span><span>📍 ${esc(state.location)}</span></div>
        <div class="goal-title">${esc(curAct.title)}</div>
        <div class="goal-desc">${esc(curAct.goal)}</div>
        ${(state.world_flags||[]).length ? `<div class="chips" style="margin-top:10px">${state.world_flags.map(f => `<span class="chip sm ally">🚩 ${esc(f)}</span>`).join('')}</div>` : ''}
      </div>`;
    }

    const clocks = state.clocks || [];
    if (clocks.length) {
      html += `<div class="card">
        <div class="label"><span>⏳ 局势进度钟</span><span>🔴威胁 🟢破局</span></div>
        <div class="clocks-grid">${clocks.map(renderClockWheel).join('')}</div>
      </div>`;
    }

    const actsList = state.suggested_actions || [];
    if (actsList.length && !state.ended_title) {
      html += `<div class="card">
        <div class="label"><span>✨ 当前参考行动方向</span><span>回 KOOK 点按钮或直接打字</span></div>
        ${actsList.map((a, i) => `<div class="act-pill"><span class="act-num">${['①','②','③','④'][i] || (i+1)}</span><span>${esc(a)}</span></div>`).join('')}
      </div>`;
    }

    const clues = state.clues || [];
    const visible = showAllClues ? clues : clues.slice(-5).reverse();
    const displayList = showAllClues ? clues.slice().reverse() : visible;
    html += `<div class="card">
      <div class="label"><span>🔎 关键线索（最新优先）</span><span>共 ${clues.length} 条</span></div>
      ${displayList.length
        ? displayList.map((c, idx) => `<div class="clue-row"><strong style="color:var(--accent)">#${clues.length - idx}</strong> ${esc(c)}</div>`).join('')
        : `<div class="muted">尚未收集到线索，去探索或和 NPC 交谈吧！</div>`}
      ${clues.length > 5 ? `<button class="link-btn" id="btn-more-clues">${showAllClues ? '▴ 收起较早线索' : `▾ 展开全部 ${clues.length} 条线索`}</button>` : ''}
    </div>`;

    $('page-body').innerHTML = html;
    const more = $('btn-more-clues');
    if (more) more.addEventListener('click', () => { showAllClues = !showAllClues; renderGoal(); });
  }

  function renderCodex() {
    const body = $('page-body');
    if (!$('codex-q')) {
      body.innerHTML = `
        <div class="search-wrap">
          <input id="codex-q" type="text" value="${esc(searchQ)}" placeholder="🔍 搜人名 / 道具 / 线索 / 世界设定…" autocomplete="off" />
          <button class="search-x" id="codex-x">✕</button>
        </div>
        <div id="codex-inner"></div>`;
      const inp = $('codex-q'), xbtn = $('codex-x');
      inp.addEventListener('input', () => {
        searchQ = inp.value;
        xbtn.style.display = searchQ ? 'block' : 'none';
        renderCodexInner();
      });
      xbtn.addEventListener('click', () => {
        searchQ = ''; inp.value = ''; xbtn.style.display = 'none';
        renderCodexInner();
      });
    }
    const xbtn = $('codex-x');
    if (xbtn) xbtn.style.display = searchQ ? 'block' : 'none';
    renderCodexInner();
  }

  function renderCodexInner() {
    let html = '';
    if (searchQ.trim()) {
      const q = searchQ.trim().toLowerCase();
      const hit = (s) => String(s || '').toLowerCase().includes(q);
      const res = [];
      (state.npcs || []).forEach(n => { if (hit(n.name) || hit(n.status) || hit(n.attitude)) res.push(`<div class="clue-row"><span class="chip sm ${esc(n.attitude_tier)}">NPC · ${esc(n.attitude)}</span> <strong>${esc(n.name)}</strong><div class="muted" style="margin-top:3px">${esc(n.status)}</div></div>`); });
      (state.party || []).forEach(p => { if (hit(p.character_name) || hit(p.role_desc)) res.push(`<div class="clue-row"><span class="chip sm accent">小队</span> <strong>${esc(p.character_name)}</strong>（${esc(p.role_desc)}）</div>`); });
      (state.me.inventory || []).forEach(i => { if (hit(i)) res.push(`<div class="clue-row"><span class="chip sm">🎒 道具</span> ${esc(i)}</div>`); });
      (state.clues || []).forEach(c => { if (hit(c)) res.push(`<div class="clue-row"><span class="chip sm ally">🔎 线索</span> ${esc(c)}</div>`); });
      (state.me.whispers || []).forEach(w => { if (hit(w.content)) res.push(`<div class="whisper-card"><div class="whisper-hd"><span>🤫 第 ${w.turn_number} 轮密语</span></div><div class="whisper-txt">${esc(w.content)}</div></div>`); });
      (state.glossary || []).forEach(g => { if (hit(g.title) || hit(g.content) || g.keywords.some(hit)) res.push(`<div class="card"><div class="goal-title" style="font-size:13px">📚 ${esc(g.title)}</div><div class="muted" style="color:var(--text);white-space:pre-line">${esc(g.content)}</div></div>`); });
      html = `<div class="label" style="margin-bottom:8px"><span>搜索「${esc(searchQ.trim())}」</span><span>${res.length} 条结果</span></div>` +
        (res.length ? res.join('') : `<div class="empty">已解锁资料中暂时没出现「${esc(searchQ.trim())}」喵～</div>`);
    } else {
      html = `<div class="subpills">
        <button class="subpill ${codexSub==='map'?'active':''}" data-sub="map">🗺️ 地图</button>
        <button class="subpill ${codexSub==='lore'?'active':''}" data-sub="lore">📚 常识</button>
        <button class="subpill ${codexSub==='recap'?'active':''}" data-sub="recap">📖 前情</button>
      </div>`;

      if (codexSub === 'map') {
        const mp = state.map;
        if (mp && mp.nodes && mp.nodes.length) {
          const byId = Object.fromEntries(mp.nodes.map(n => [n.id, n]));
          const edges = (mp.edges || []).map((e) => {
            const a = byId[e.from], b = byId[e.to];
            if (!a || !b) return '';
            const x1 = a.x * 3.4 + 10, y1 = a.y * 2.1 + 12, x2 = b.x * 3.4 + 10, y2 = b.y * 2.1 + 12;
            return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${e.locked ? '#f85149' : '#64748b'}" stroke-width="1.8" ${e.locked ? 'stroke-dasharray="4 3"' : ''}/>` +
              (e.label ? `<text x="${(x1+x2)/2}" y="${(y1+y2)/2 - 3}" text-anchor="middle" fill="#94a3b8" font-size="8.5">${esc(e.label)}</text>` : '');
          }).join('');
          const nodes = mp.nodes.map((n) => {
            const x = n.x * 3.4 + 10, y = n.y * 2.1 + 12;
            const cur = n.id === mp.active_node_id;
            const fill = cur ? 'var(--accent)' : n.visited ? '#3fb950' : '#475569';
            return `<g>
              ${cur ? `<circle cx="${x}" cy="${y}" r="14" fill="none" stroke="var(--accent)" stroke-width="2" class="pulse-ring"/>` : ''}
              <circle cx="${x}" cy="${y}" r="${cur ? 9 : 7}" fill="${fill}" stroke="#0c0a09" stroke-width="2"/>
              <text x="${x}" y="${y + 19}" text-anchor="middle" fill="${cur ? 'var(--accent)' : '#cbd5e1'}" font-size="9.5" font-weight="${cur ? 700 : 500}">${esc(cut(n.name, 7))}</text>
            </g>`;
          }).join('');
          html += `<div class="graph-box"><svg class="graph-svg" viewBox="0 0 360 238">${edges}${nodes}</svg></div>
            <div class="muted" style="text-align:center">🟡 当前位置　🟢 已探索　⬜ 未前往　🔴虚线=未解锁通道</div>`;
        } else {
          html += `<div class="empty">当前剧本暂未绘制节点地图。</div>`;
        }
      } else if (codexSub === 'lore') {
        const gl = state.glossary || [];
        html += gl.length
          ? gl.map(g => `<div class="card">
              <div class="goal-title" style="font-size:13.5px">${esc(g.title)}</div>
              <div style="font-size:12.5px;white-space:pre-line">${esc(g.content)}</div>
              ${g.keywords.length ? `<div class="chips" style="margin-top:8px">${g.keywords.map(k => `<span class="chip sm">${esc(k)}</span>`).join('')}</div>` : ''}
            </div>`).join('')
          : `<div class="empty">当前剧本暂无公开常识词条。</div>`;
        if (state.bulletins && state.bulletins.length) {
          html += `<div class="label" style="margin:12px 2px 8px"><span>📰 已浮现势力号外</span><span>${state.bulletins.length} 条</span></div>` +
            state.bulletins.slice().reverse().map(b => `<div class="card"><div class="goal-title" style="font-size:13px">【${esc(b.faction || '暗流')}】${esc(b.headline)}</div><div class="muted" style="color:var(--text)">${esc(b.body)}</div></div>`).join('');
        }
      } else {
        const turns = state.recent_turns || [];
        const sumTxt = (state.summary || '').trim();
        if (sumTxt) {
          const upto = state.summary_upto_turn ? `截至第 ${state.summary_upto_turn} 轮` : '长期记忆本';
          html += `<div class="card focus">
            <div class="label"><span>📜 历史前情总览</span><span>${esc(upto)}</span></div>
            <div style="font-size:12.5px;white-space:pre-line;line-height:1.65">${esc(sumTxt)}</div>
          </div>`;
        }
        html += turns.length
          ? turns.map(t => `<div class="card">
              <div class="goal-title" style="font-size:13px">第 ${t.turn_number} 轮 · ${esc(t.scene_title)}</div>
              <div class="muted" style="margin-bottom:5px">📍 ${esc(t.location)} ｜ 🕒 ${esc(t.world_time)}</div>
              <div style="font-size:12.5px">${esc(t.narrative_excerpt)}</div>
            </div>`).join('')
          : (sumTxt ? '' : `<div class="empty">推进第 1 回合后会在这里自动留存防忘词提要喵！</div>`);
      }
    }

    const inner = $('codex-inner');
    if (!inner) return;
    inner.innerHTML = html;
    inner.querySelectorAll('[data-sub]').forEach(b => b.addEventListener('click', () => {
      codexSub = b.getAttribute('data-sub');
      renderCodexInner();
    }));
  }

  function wire() {
    document.querySelectorAll('#bottom-nav .nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        page = btn.getAttribute('data-page');
        if (page === 'whispers') unreadWhispers = 0;
        const body = $('page-body');
        if (body) body.scrollTop = 0;
        render();
      });
    });

    const btnPip = $('btn-pip');
    btnPip.addEventListener('click', async () => {
      if (pipWin && !pipWin.closed) { pipWin.close(); return; }
      if ('documentPictureInPicture' in window) {
        try {
          pipWin = await window.documentPictureInPicture.requestWindow({ width: 390, height: 660 });
          pipWin.document.documentElement.setAttribute('data-theme', (state && state.theme) || 'ember');
          pipWin.document.head.appendChild(document.getElementById('hud-styles').cloneNode(true));
          pipWin.document.body.appendChild(document.getElementById('hud-root'));
          document.getElementById('pip-hold').classList.add('show');
          btnPip.classList.add('pip-on');
          btnPip.textContent = '📌 置顶中';
          pipWin.addEventListener('pagehide', () => {
            document.body.appendChild(pipWin.document.getElementById('hud-root'));
            document.getElementById('pip-hold').classList.remove('show');
            btnPip.classList.remove('pip-on');
            btnPip.textContent = '📌 浮窗';
            pipWin = null;
          });
          return;
        } catch (_) {}
      }
      const pop = window.open(location.href, 'kook_tavern_hud', 'width=395,height=680,resizable=yes,scrollbars=yes');
      if (!pop) toast('⚠️ 浏览器拦截了弹窗，请允许本页弹窗或直接把标签页拖窄放 KOOK 旁边喵！', 5000);
    });
    document.getElementById('btn-pip-back').addEventListener('click', () => {
      if (pipWin && !pipWin.closed) pipWin.close();
    });
  }

  function startSse() {
    let openedOnce = false;
    const es = new EventSource(sseUrl);
    es.onopen = () => { if (openedOnce) fetchHud(); openedOnce = true; };
    es.addEventListener('update', () => fetchHud());
    es.addEventListener('reset', () => {
      setDot('err');
      toast('🏁 本局已结团清桌，旧浮窗已失效喵！', 10000);
      es.close();
    });
    es.onerror = () => setDot('warn');
  }

  wire();
  fetchHud();
  startSse();
})();
</script>
</body>
</html>
