rules:
  tension_pace: "brisk"
  lethality: "balanced"
  clue_generosity: "balanced"
  dm_weight_note: "鼓励巧用道具、酒馆情报交易与团队分工；教会暗哨与星雾蔓延应持续制造时间压迫感。"
  bulletin_name: "《余烬流言板 · 灰烬港号外》"
  bulletin_interval: 6
  factions:
    - name: "圣光教会暗哨（艾琳）"
      goal: "抢夺03-17钥匙并在午夜前彻底炸毁旧钟楼连同白鸦一并清除"
      escalation: "封锁码头退路、加价悬赏拉拢或半路截击小队"
    - name: "叛逃炼金师（白鸦）"
      goal: "在潮汐星仪爆裂前拿到钥匙脱身，或借冒险者之手稳住核心"
      escalation: "放出更高赏金、用高频信号引导小队前往三层"
    - name: "失控星雾与拟声雾傀"
      goal: "借助午夜过载将淡蓝星雾吞没整座灰烬港"
      escalation: "模仿熟人声音三声敲门诱骗，令街区守夜人陆续失联"
  must_hit_beats:
    - act: 1
      by_turn: 4
      flag: "教会暗哨现身"
      prompt_hint: "灰帽修女艾琳的教会暗哨已盯上接悬赏的小队，可在大厅角落或门外露出一丝寒光试探。"
    - act: 2
      by_turn: 7
      flag: "遭遇拟声雾傀"
      prompt_hint: "雾中传来极似老雷恩或托比的声音并伴随三声轻敲，引出拟声雾傀的试探与弱点线索。"
    - act: 3
      by_turn: 10
      flag: "星仪午夜过载警报"
      prompt_hint: "旧钟楼顶层传来沉闷齿轮轰鸣，星仪蓝焰暴涨，提示午夜钟声已迫在眉睫。"
    - act: 3
      by_turn: 11
      flag: "白鸦正面现身摊牌"
      prompt_hint: "反锁在三层玻璃观测室的叛逃炼金师白鸦（卡修斯）必须立刻拍窗现身、用大白话正面摊牌，亮出星铜怀表与三百银盾，让玩家在安全停机/交易脱身/强行摧毁之间做出明确终局抉择。"

clocks:
  - id: star_overload
    name: "午夜星仪过载"
    kind: threat
    segments: 6
