  - name: "港口赏金猎人"
    traits: ["枪法准", "直觉敏锐"]
    bonus_items: ["蚀刻左轮（剩余2发银弹）", "粗麻攀岩绳"]
    stats: { body: 2, agility: 2, investigate: 0, social: -1, insight: 0 }
  - name: "星象神秘学者"
    traits: ["博学", "嗅觉诡异"]
    bonus_items: ["星图黄铜罗盘", "炼金封印盐袋"]
    stats: { body: -1, agility: 0, investigate: 2, social: 0, insight: 2 }
  - name: "酒馆情报贩子"
    traits: ["嘴甜", "人脉广"]
    bonus_items: ["老雷恩的旧人情筹码", "假银盾两枚"]
    stats: { body: -1, agility: 1, investigate: 1, social: 2, insight: 0 }

acts:
  - id: act1_tavern
    title: "暴雪夜的蓝血信使"
    goal: "查清信使托比、断钥匙 03-17 与独眼酒保老雷恩背后的纠葛"
    advance_flags: ["取得老雷恩信任", "找到地下酒窖另一半钥匙"]
  - id: act2_harbor
    title: "星雾码头与旧钟楼攀行"
    goal: "顶着星雾潜入或强闯旧钟楼，避开教会暗哨与迷雾回响"
    advance_flags: ["抵达旧钟楼三层", "识破星雾回响"]
    enter_nodes: ["harbor_wharf", "cliff_path", "clocktower_low"]
  - id: act3_star_orb
    title: "午夜潮汐星仪终局"
    goal: "在午夜钟声前面对白鸦与潮汐星仪，做出决定灰烬港命运的抉择"
    advance_flags: ["停机或摧毁潮汐星仪"]
    enter_nodes: ["clocktower_core"]

endings:
  - id: ending_dawn
    title: "晨雾散尽"
    kind: "true"
    summary: "集齐双半钥匙并取得星铜怀表，完成潮汐星仪安全停机，星雾退散、灰烬港获救。"
  - id: ending_gold_deal
    title: "灰金交易"
    kind: "normal"
    summary: "收下白鸦三百银盾掩护其脱身，或将星仪交给教会修女艾琳，小队暴富但港口付出代价。"
  - id: ending_ember_blast
    title: "余烬轰鸣"
    kind: "bad"
    summary: "强行引爆潮汐星仪或未能阻止午夜过载，旧钟楼在蓝焰中崩塌，小队九死一生或饮恨收场。"

worldbook:
  - id: wb_tavern_rules
    title: "灰烬港与余烬酒馆常识"
    keywords: ["灰烬港", "酒馆", "银盾", "规矩"]
    always_active: true
    player_visible: true
    priority: 100
    content: |
      灰烬港是一座依赖蒸汽灯塔与炼金贸易的港口自由城。
      余烬酒馆是佣兵、水手与情报贩子的中立地带，铁律是“大厅内严禁见血，违者会被老雷恩赶出去”。
      最近三夜港口持续笼罩着诡异的淡蓝色“星雾”，吸入过久会咳出荧光蓝血并产生幻听，已有两名港口守夜人离奇失踪。
      本局核心登场人物（公开信息）：独眼酒保老雷恩（酒馆老板）、黑斗篷信使托比（跌进酒馆的蓝血求援者）、神秘悬赏人白鸦（悬赏取回“星铜怀表”的委托人）、角落灰帽女子（观察悬赏板的陌生人）。

  - id: wb_old_ren
    title: "独眼酒保老雷恩的秘密与态度"
    keywords: ["老雷恩", "酒保", "柜台", "霰弹枪", "打听", "筹码", "怀表"]
    always_active: false
    priority: 90
    content: |
      老雷恩年轻时是旧钟楼守望团的首席机械师，右眼在十年前一次潮汐星仪事故中失明。初始对陌生人【警惕】。
      如果玩家出示断掉的铜钥匙、提到“白鸦”或出示人情筹码，老雷恩会压低声音透露：白鸦并不是什么富商，而是当年与他共事、后被教会通缉的炼金师；若小队展现出保护港口而非单纯贪财的诚意，老雷恩态度转为【信任】，并主动交出厨房通往地下酒窖的钥匙和一把“防雾铜哨”。

  - id: wb_messenger
    title: "黑斗篷信使托比与荧光蓝血"
    keywords: ["信使", "斗篷", "蓝血", "荧光", "钥匙", "检查", "治疗", "扶"]
    always_active: false
    priority: 95
    content: |
      信使名叫托比，是铁匠铺学徒。他并非中毒，而是被旧钟楼泄漏的“星髓蒸汽”灼伤肺部。
      若玩家妥善救治或安抚他，他会在昏迷前吐露关键信息：“钟楼的雾里有会模仿熟人声音的影子……千万别给敲三下门的东西开门！另一半钥匙被老雷恩藏在地下酒窖的 17 号黑麦酒桶里。”
      断掉的铜钥匙背面刻着极小的机械编号 `03-17`，仔细摸索他的袖袋还能发现一张被水浸湿的钟楼楼梯简图。

  - id: wb_cellar
    title: "酒馆地下酿酒窖与17号暗格"
    keywords: ["酒窖", "地下室", "厨房", "暗格", "17", "另一半", "酒桶"]
    always_active: false
    priority: 85
    content: |
      通往地下酿酒窖的活板门藏在厨房腌肉橡木桶后。若潜入需要过潜行/开锁检定，若已取得老雷恩信任可直接通行。
      在编号“17”的陈年黑麦酒桶夹层中，藏着另一半铜钥匙（与托比的半截可咬合为完整的“钟楼机房总钥”）、两瓶可抵御星雾侵蚀的“琥珀抗雾剂”，以及一张泛黄合影（照片上是年轻的老雷恩与白鸦站在潮汐星仪前）。

  - id: wb_nun_spy
    title: "酒馆角落的教会暗哨「灰帽修女」"
    keywords: ["角落", "观察", "环顾", "悬赏", "木板", "教会", "陌生人", "跟踪"]
    always_active: false
    priority: 75
    content: |
      酒馆阴影角落里坐着一名一直没碰酒杯的灰帽女子——她是圣光教会的异端清剿员艾琳。
      若眼尖的玩家环顾大厅或掷出高侦查点数，DM 可通过 private_whispers 私下告知：灰帽女子在信使进门时手按上了腰间圣银短刃，并悄悄抄下了接悬赏之人的相貌。
      艾琳的目标是直接炸毁旧钟楼连同白鸦一起埋葬，若被识破，她既可能提出额外悬赏拉拢小队，也可能在半路抢夺钥匙。

  - id: wb_cliff_path
    title: "峭壁栈道与失踪的港口守夜人"
    keywords: ["出发", "出门", "港口", "峭壁", "路上", "守夜人", "雾", "钟楼"]
    always_active: false
    priority: 80
    content: |
      前往旧钟楼必须穿过被淡蓝星雾吞没的峭壁石阶。没喝抗雾剂或没掩口鼻的角色在浓雾中会持续流失 1 点 SAN 并听见亲友的呼救幻听。
      半山腰的灯柱旁能发现一名失踪守夜人留下的防风提灯与半截粉笔字：“它学老雷恩说话……怕火与高频铜哨”。

  - id: wb_mimic_puppet
    title: "旧钟楼一二层与「拟声雾傀」"
    keywords: ["钟楼", "一楼", "二楼", "敲门", "影子", "怪物", "雾傀", "声音", "战斗"]
    always_active: false
    priority: 88
    content: |
      旧钟楼一二层游荡着白鸦失控的炼金造物“拟声雾傀”——由冷凝星雾与生锈齿轮拼成，会精准模仿托比或老雷恩的声音，在门外有节奏地轻敲三下诱骗人开门。
      硬拼物理伤害极难奏效（容易导致队员受伤），但它的核心畏惧三样东西：剧烈明火（火折子/酒窖烈酒）、老雷恩的防雾铜哨高频共振、或直接用银弹击碎胸口发光的蓝色晶核。

  - id: wb_clocktower_core
    title: "钟楼三层「潮汐星仪」与星铜怀表真相"
    keywords: ["三层", "机房", "星仪", "怀表", "核心", "白鸦", "齿轮", "03-17"]
    always_active: false
    priority: 92
    content: |
      钟楼三层的巨型黄铜球体“潮汐星仪”正在失控过载，不断向整个灰烬港喷吐星雾。
      星铜怀表根本不是普通古董，而是插入星仪中枢才能安全停机的“稳压保险栓”——但取出或插入怀表必须先用拼接完整的 `03-17` 铜钥匙打开防护罩，否则强行破拆会引发剧烈电弧反噬。

  - id: wb_white_crow
    title: "叛逃炼金师「白鸦」与立场博弈"
    keywords: ["白鸦", "谈判", "交易", "救", "拷问", "真相", "银盾", "三层", "机房", "星仪", "观测室", "梯井", "钟楼"]
    always_active: false
    priority: 96
    content: |
      自称“白鸦”的炼金师名叫卡修斯，此刻被反锁在三层玻璃观测室里，手边确实放着一袋沉甸甸的银盾与星铜怀表。
      只要玩家抵达钟楼三层星仪机房或梯井，白鸦必须立刻拍打观测室玻璃现身、用大白话正面摊牌：他当年与老雷恩研发潮汐星仪本是为了帮港口驱散风暴，却被教会诬陷为异端；今夜他重启星仪失败才酿成大祸。他急于保命，愿意支付三百银盾换小队帮他带走星铜怀表并脱身，但若拿走怀表不安全停机，星仪将在午夜彻底爆裂笼罩全城。

  - id: wb_endings
    title: "午夜钟声与三种终局收束"
    keywords: ["午夜", "停机", "破坏", "炸毁", "结局", "撤离", "离开", "修好", "三层", "机房", "星仪", "白鸦"]
    always_active: false
    priority: 90
    content: |
      当剧情推进至三层星仪核心决断时，DM 应引导进入明确终局并给出极具画面感的收束段落，并在结尾提示房主可导出战报结团：
      1.【晨雾散尽（真结局）】：集齐钥匙并说服/夺得星铜怀表，完成安全停机程序，星雾退散、港口获救，老雷恩与白鸦十年恩怨在晨光中了结。
      2.【灰金交易（现实结局）】：收下白鸦的三百银盾掩护其逃走，或把星仪卖给教会修女艾琳，小队暴富但灰烬港付出惨重代价。
      3.【余烬轰鸣（悲壮结局）】：强行引爆潮汐星仪摧毁雾源，钟楼在蓝焰中崩塌，小队九死一生逃出生天。

