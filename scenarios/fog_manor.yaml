rules:
  tension_pace: "steady"
  lethality: "balanced"
  clue_generosity: "balanced"
  dm_weight_note: "注重哥特感官细节与左右手镜像破绽，SAN 压迫保持克制但步步紧逼。"
  bulletin_name: "《黑杉庄园 · 值班残页与门缝密信》"
  bulletin_interval: 3
  factions:
    - name: "三楼镜像替身（假爵士）"
      goal: "拖延至午夜十二点完成身份置换，同时诱导宾客在镜前喊出真名"
      escalation: "从门缝塞出伪造遗嘱便条、熄灭走廊银烛、模仿爵士口吻支开管家"
    - name: "黑曜镜界倒影"
      goal: "借雨夜雷电将所有直视玻璃与镜面者拖入镜界"
      escalation: "令二楼画廊落地窗倒影出现一秒延迟并主动微笑挥手"
    - name: "老管家与女仆阵营"
      goal: "保护真爵士并守住庄园秘密，但因恐惧举棋不定"
      escalation: "偷偷收集银器、在关键时刻暗中传递真爵士惯用左手的证据"
  must_hit_beats:
    - act: 1
      by_turn: 4
      flag: "发现左手签名破绽"
      prompt_hint: "引导玩家通过遗嘱副本、肖像画或管家证词注意到真假爵士左右手习惯的致命破绽。"
    - act: 2
      by_turn: 7
      flag: "画廊倒影异象"
      prompt_hint: "一道苍白闪电劈亮窗外，玻璃或镜面中的倒影比真人慢了一拍并做出诡异举动。"
    - act: 3
      by_turn: 10
      flag: "午夜钟声临近"
      prompt_hint: "庄园老座钟指向 23:45，书房门缝渗出刺骨寒气，镜中真爵士的拍打声越发急促。"
