id: fog_manor
name: "雨夜黑杉庄园"
tagline: "经典暴风雪山庄式悬疑调查——失踪的继承人与午夜双生镜"
genre: "悬疑调查 / 轻量克系文字冒险"
dm_style: |
  你是一位擅长营造哥特悬疑氛围的守密人（KP / DM）。
  注重感官细节（雨打彩窗、潮湿旧木香、烛火晃动、细微的镜像左右手破绽），让玩家通过盘问、勘查与拼凑线索逐步揭开真相。
  合理利用 private_whispers 给侦查敏锐或单独探索的玩家私发诡异目击；用 npc_updates 记录老管家、女仆和“爵士”对小队的信任或警觉程度；遇到超自然异象时适当扣除 1~2 点 SAN，但保持公平克制。
initial_location: "黑杉庄园 · 一楼会客厅"
initial_time: "1926年秋 · 暴雨夜 20:30"
opening_scene: |
  暴雨拍打着黑杉庄园高耸的彩色玻璃窗，山体滑坡已经彻底冲断了通往山下小镇的唯一石桥。
  你们应庄园主——古董收藏家奥古斯特·范恩爵士的亲笔邀请函而来，却只见到了面色苍白的老管家塞巴斯蒂安。
  壁炉上方挂着一幅被划破的家族肖像画，长桌上摆着尚未动过的冷晚餐和一封蜡封完好的遗嘱副本。
  老管家声音微颤地躬身说道：“各位贵客非常抱歉……爵士从傍晚六点把自己反锁在三楼书房后，就再也没有应过门。而刚才打雷的时候，女仆听见书房里传出了两个人的笑声。”
opening_actions:
  - "盘问面色苍白的老管家塞巴斯蒂安"
  - "上前检查壁炉上方被划破的家族肖像画"
  - "拿手电筒上三楼查看反锁的书房门"

player_defaults:
  max_hp: 10
  max_san: 10
  starter_items:
    - "范恩爵士的亲笔邀请函"
    - "手电筒（电量充足）"
    - "记事本与铅笔"

preset_roles:
  - name: "私家侦探"
    traits: ["眼尖", "逻辑严密"]
    bonus_items: ["黄铜放大镜", "万能撬锁铁丝"]
  - name: "神秘学记者"
    traits: ["见多识广", "嘴快"]
    bonus_items: ["镁粉闪光相机", "开罗古董拍卖剪报"]
  - name: "家族遗嘱律师"
    traits: ["沉着", "擅长核对笔迹"]
    bonus_items: ["爵士左手签名档案", "纯银怀表"]
  - name: "退伍军医"
    traits: ["胆大", "懂急救"]
    bonus_items: ["急救药箱", "纯银手术刀"]

worldbook:
  - id: fm_layout
    title: "黑杉庄园结构与核心镜界真相"
    keywords: ["庄园", "一楼", "二楼", "三楼", "书房", "地图"]
    always_active: true
    priority: 100
    content: |
      黑杉庄园共三层加一间地下玻璃温室：一楼为会客厅、餐厅与厨房；二楼为客房与长画廊；三楼为禁区书房与阁楼。
      核心真相：奥古斯特爵士上月从埃及秘密购入一面“双生黑曜镜”，沉迷于与镜中倒影对话。今夜他并未被人类杀害，而是被镜中替身骗进并困在了镜界；书房里的“假爵士”正准备在午夜十二点钟声敲响时彻底顶替他的身份。

  - id: fm_butler
    title: "老管家塞巴斯蒂安的隐情与态度"
    keywords: ["管家", "塞巴斯蒂安", "盘问", "笑声", "钥匙", "信任"]
    always_active: false
    priority: 90
    content: |
      塞巴斯蒂安在范恩家服侍四十年，忠心耿耿但极度迷信，初始态度【惶恐防备】。
      他隐瞒了一件事：昨晚半夜他曾透过门缝看到爵士在镜子前对着空无一人的方向敬酒，且镜子里的爵士抬手比真人慢了整整一秒。
      若玩家态度诚恳、安抚他或出示画廊/肖像画的异常证据，他会转为【信任】，交出三楼书房的备用黄铜钥匙，并提醒“爵士天生是左撇子，可傍晚在门缝递字条时，笔迹却是右手写的”。

  - id: fm_maid
    title: "女仆玛莎的证词与壁炉碎银"
    keywords: ["女仆", "玛莎", "厨房", "壁炉", "灰烬", "银", "餐具"]
    always_active: false
    priority: 82
    content: |
      惊魂未定的女仆玛莎躲在厨房里擦拭银烛台。她听到书房里两个一模一样的声音在互相念着爵士的全名“奥古斯特·爱德华·范恩”。
      若玩家翻查一楼会客厅尚未熄灭的壁炉灰烬，可发现一只被匆忙扔进火里、熏黑却未熔化的纯银护符扣环（可用 private_whispers 悄悄提示翻查者：扣环内侧刻着反写的名字）。

  - id: fm_portrait
    title: "被划破的家族肖像与开罗拍卖清单"
    keywords: ["肖像", "画", "壁炉", "划破", "拍卖", "清单", "黑曜"]
    always_active: false
    priority: 88
    content: |
      壁炉上方的肖像画被利器斜划了一道——仔细观察（或用放大镜）会发现，被精准划掉的正是画中先祖胸前那块克制邪影的黑曜石护符，且油画颜料切口极新，是今晚刚划的。
      画框背面夹着一张撕碎的开罗拍卖清单，背面潦草写着旧货商阿卜杜勒的血红警告：“双生镜厌恶纯银与强光，切勿在雷雨夜于镜前呼唤自己的真名！”

  - id: fm_will
    title: "长桌冷晚餐与蜡封遗嘱破绽"
    keywords: ["遗嘱", "晚餐", "长桌", "邀请函", "签名", "笔迹", "左手", "右手"]
    always_active: false
    priority: 84
    content: |
      长桌上的蜡封遗嘱副本写着若爵士失踪，庄园归“最先在午夜走进三楼书房见证者”所有——明显是假爵士伪造用来引诱宾客上楼的诱饵。
      对比邀请函与遗嘱末尾签名，细心者（或家族律师）能看出关键破绽：邀请函是流畅的左手斜体，而遗嘱副本是僵硬的右手镜像模仿体！

  - id: fm_gallery
    title: "二楼长画廊与延迟倒影陷阱"
    keywords: ["二楼", "画廊", "走廊", "落地窗", "倒影", "玻璃", "镜"]
    always_active: false
    priority: 80
    content: |
      二楼画廊挂满镀银框古画与一整排雨夜落地玻璃。走过此处时，闪电照亮玻璃倒影——倒影中的队员动作会比本人慢半拍，甚至其中一人的倒影会对真人露出诡异微笑！
      此处可触发 SAN 检定（失败 -1~2 SAN）；若使用闪光相机或强光照射玻璃，倒影会尖叫退散，并在地上震落一张通往地下温室的钥匙牌。

  - id: fm_greenhouse
    title: "地下玻璃温室与完整纯银烛台"
    keywords: ["地下", "温室", "花园", "植物", "烛台", "护符", "银器"]
    always_active: false
    priority: 78
    content: |
      地下玻璃温室里种满了早已枯萎的夜光兰，石台暗格里藏着爵士原本用来镇压双生镜的“圣银三叉烛台”与半枚完整的黑曜石护符。
      带上纯银物品（烛台、银刀、银怀表）进入三楼书房，会对镜中替身造成极强的压制效果。

  - id: fm_attic
    title: "三楼阁楼与爵士绝笔日记"
    keywords: ["阁楼", "日记", "手稿", "秘密", "三楼", "梯子"]
    always_active: false
    priority: 76
    content: |
      书房隔壁的阁楼里散落着爵士近一周的实验日记，最后一页写着救命之法：
      “它偷走了我的右影，在午夜十二点敲响前，只要用纯银击碎蒙布下的黑曜镜，或者让外人举着亲笔邀请函对着镜面呼唤我的全名‘奥古斯特·爱德华·范恩’，就能逆转置换！绝不能让它吹灭书房里的银烛！”

  - id: fm_study
    title: "三楼书房与「镜像爵士」终极对峙"
    keywords: ["书房", "敲门", "撬锁", "破门", "爵士", "黑布", "落地镜", "真名"]
    always_active: false
    priority: 95
    content: |
      书房门从内插栓，门缝透出刺骨寒气。进入后，“爵士”会端坐在书桌后故作镇定地倒红酒，声称刚才只是放留声机唱片。
      三大破绽：1. 他用右手握钢笔与酒杯（真爵士是左撇子）；2. 绝不敢触碰纯银器皿或让镁粉强光直射；3. 房间角落蒙着黑丝绒布的高大黑曜落地镜里，隐约能看到真正的爵士正满脸焦急地无声拍打镜面！
      强攻替身会引发镜界反噬（扣除 HP 与 SAN）；结合纯银器/强光压制替身 + 呼唤真名或击碎黑曜镜即可破局。

  - id: fm_endings
    title: "午夜钟声与三种结局收束"
    keywords: ["午夜", "十二点", "砸碎", "碎镜", "结局", "天亮", "逃离"]
    always_active: false
    priority: 86
    content: |
      当三楼书房对峙落幕或午夜十二点钟声敲响时，DM 应呈现极具电影感的结局收尾，并提示房主可导出战报结团：
      1.【碎镜重圆（真结局）】：在午夜前压制替身并用银器碎镜/呼唤全名，真爵士跌出镜界获救，暴雨渐歇，重金酬谢众人。
      2.【雨夜孤逃（惊险结局）】：未能救出真爵士但及时识破危险撤离庄园，次日听闻“范恩爵士”性情大变、将全庄园镜子全部摘除。
      3.【镜中永夜（克系坏结局）】：理智归零或在十二点后被替身诱入镜前，众人被困入冰冷寂静的镜像庄园。
