id: fog_manor
name: "雨夜黑杉庄园"
tagline: "经典暴风雪山庄式悬疑调查——失踪的继承人与午夜钟声"
genre: "悬疑调查 / 轻量克系文字冒险"
dm_style: |
  你是一位擅长营造哥特悬疑氛围的守密人（KP / DM）。
  注重感官细节（雨声、潮湿木香、烛火晃动、微妙的微表情），让玩家通过观察、盘问与推理逐步拼凑真相。
  合理利用 private_whispers 给侦查敏锐或单独行动的玩家私发秘密线索；遇到诡异现象时适当扣除 SAN 值，但保持公平克制。
initial_location: "黑杉庄园 · 一楼会客厅"
initial_time: "1926年秋 · 暴雨夜 20:30"
opening_scene: |
  暴雨拍打着黑杉庄园高耸的彩色玻璃窗，山体滑坡已经彻底冲断了通往山下小镇的唯一石桥。
  你们应庄园主——古董收藏家奥古斯特·范恩爵士的亲笔邀请函而来，却只见到了面色苍白的老管家塞巴斯蒂安。
  壁炉上方挂着一幅被划破的家族肖像画，长桌上摆着尚未动过的冷晚餐和一封蜡封完好的遗嘱副本。
  老管家声音微颤地躬身说道：“各位贵客非常抱歉……爵士从傍晚六点把自己反锁在三楼书房后，就再也没有应过门。而刚才打雷的时候，女仆听见书房里传出了两个人的笑声。”
opening_actions:
  - "盘问面色苍白的老管家塞巴斯蒂安"
  - "上前检查壁炉上方被划破的家族肖像画"
  - "拿手电筒上三楼查看反锁的书房门"

player_defaults:
  max_hp: 10
  max_san: 10
  starter_items:
    - "范恩爵士的邀请函"
    - "手电筒（电量充足）"
    - "记事本与铅笔"

worldbook:
  - id: fm_layout
    title: "黑杉庄园结构与核心秘密"
    keywords: ["庄园", "一楼", "二楼", "三楼", "书房", "地图"]
    always_active: true
    priority: 100
    content: |
      黑杉庄园共三层加一间地下温室：一楼为会客厅、餐厅与厨房；二楼为客房与画廊；三楼为禁区书房与阁楼。
      核心真相：奥古斯特爵士最近从埃及拍卖会购入一面“双生黑曜镜”，沉迷于与镜中倒影对话。今夜他并未被人类杀害，而是被镜中替身困在了镜界，书房里的“爵士”正准备在午夜十二点彻底顶替他的身份。

  - id: fm_butler
    title: "老管家塞巴斯蒂安的隐情"
    keywords: ["管家", "塞巴斯蒂安", "盘问", "女仆", "笑声"]
    always_active: false
    priority: 85
    content: |
      塞巴斯蒂安忠心耿耿但极度迷信。他隐瞒了一件事：昨天半夜他曾看到爵士在镜子前对着空无一人的方向敬酒，而且镜子里的爵士抬手比真人慢了整整一秒。
      如果玩家态度诚恳或出示画廊里的异常证据，他会交出三楼书房的备用黄铜钥匙。

  - id: fm_portrait
    title: "被划破的家族肖像与画廊"
    keywords: ["肖像", "画", "画廊", "遗嘱", "壁炉"]
    always_active: false
    priority: 80
    content: |
      会客厅壁炉上方的肖像画被利器从左向右斜划了一道——仔细观察会发现，被划掉的其实是画中爵士手里拿着的一块黑曜石护符。
      画框背面夹着一张撕碎的拍卖清单，标明“开罗旧货商阿卜杜勒警告：切勿在雷雨夜于镜前呼唤自己的真名”。

  - id: fm_study
    title: "三楼书房与双生黑曜镜"
    keywords: ["书房", "镜子", "黑曜", "敲门", "撬锁", "破门"]
    always_active: false
    priority: 90
    content: |
      书房门从内部插了门闩，但门缝下透出诡异的冷气。
      推门后“爵士”会表现得彬彬有礼，声称刚才只是放了留声机唱片，但他拿钢笔的手与招待信上的惯用手相反（镜像反转！），且绝不肯靠近银质烛台或正面直视房间角落蒙着黑布的高大落地镜。
      用银器击碎黑曜镜或用邀请函上的真名反向呼唤，即可将真正的爵士拉回现实；直接强攻替身则会引发剧烈的理智冲击。
