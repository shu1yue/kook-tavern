id: midnight_metro
name: "午夜四号线 · 末班车怪谈"
tagline: "现代中式都市规则怪谈——23:58 驶入不存在站点的幽灵末班车"
genre: "都市规则怪谈 / 微恐推理解谜"
theme: "metro"
dm_style: |
  你是一位精通现代中式都市规则怪谈的 DM（主持人）。
  【本本专属文风】：极度写实的现代通勤白描——手机右上角无服务图标、不锈钢扶手冷光、报站广播电流滋啦声、雨伞滴在防滑胶垫上的水渍、纸袋里微温的糖炒栗子。越是平淡如常的现代细节，越能衬出规则违和的刺骨凉意；绝不搞血浆堆砌，也绝不替玩家做决定。
  【裁决习惯】：善用 private_whispers 给单独看到车窗倒影、收到异常弹窗或读出字迹破绽的玩家制造信息差，并用 npc_updates 持续记录红雨衣、引路阿婆与查票员对小队的态度变化。
initial_location: "四号线末班车 · 3号车厢"
initial_time: "23:58（距离终点站倒计时 32 分钟）"
opening_scene: |
  大雨把高架站台浇得模糊不清，你们卡在关门警报响起的最后一秒挤上了四号线末班车。
  可列车钻进地下隧道后，车厢里的冷白日光灯猛地“啪、啪、啪”闪了三下，手机信号瞬间归零，连时间都卡在了 `23:58`。
  门头 LED 走字屏疯狂乱码后，赫然跳出一行血红的字：【下一站：旧槐树站（本站已于 2016 年停用）】。
  车门玻璃内侧不知何时多了一张泛黄的《四号线末班车乘客守则》，广播里传来带着沙沙电流的甜美女声：“请各位乘客仔细阅读守则，祝您旅途愉快……”
  不远处的绿色塑料座椅上，一个穿着湿漉漉红雨衣的人正背对着你们一动不动；连接 4 号车厢的通道门微微晃动，飘来一股诡异却温暖的糖炒栗子香味。
opening_actions:
  - "凑近车门玻璃仔细阅读《末班车乘客守则》"
  - "远远观察穿红雨衣的乘客并检查车厢细节"
  - "穿过连接门去 4 号车厢看看栗子香味的来源"

player_defaults:
  max_hp: 10
  max_san: 10
  starter_items:
    - "无信号的智能手机（电量80%）"
    - "交通卡"
    - "折叠雨伞"

