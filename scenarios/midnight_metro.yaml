rules:
  tension_pace: "intense"
  lethality: "balanced"
  clue_generosity: "balanced"
  dm_weight_note: "严守四条守则真假逻辑与现代道具巧用；熄灯、电流杂音广播与手机电量形成紧迫感。"
  bulletin_name: "《四号线调度 · 失真车厢广播》"
  bulletin_interval: 6
  factions:
    - name: "蓝衣查票员"
      goal: "诱骗乘客交出交通卡/工牌，将其标记为四号线永久乘客"
      escalation: "沿车厢逐节巡检，手里的打孔钳滴落黑水并反复背诵被篡改的第3条守则"
    - name: "幽灵隧道与假广播"
      goal: "在00:30旧槐树站假靠站时诱使活人踏出车门"
      escalation: "制造全车熄灯5秒、门头LED血字刷屏与伪造甜美女声报站"
    - name: "糖炒栗子阿婆"
      goal: "暗中护送礼貌遵守老规矩的活人找到现实交界制动时机"
      escalation: "借温热栗子香驱散寒气，悄悄传递手写黄纸条提示"
  must_hit_beats:
    - act: 1
      by_turn: 4
      flag: "挺过全车熄灯"
      prompt_hint: "车厢日光灯骤然全部熄灭进入 5 秒全黑，考验玩家是否牢记第1条守则低头闭眼。"
    - act: 2
