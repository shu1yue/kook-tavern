  - name: "加班程序员"
    traits: ["逻辑强", "记性好"]
    bonus_items: ["降噪蓝牙耳机", "公司反光工牌"]
    stats: { body: -1, agility: 0, investigate: 2, social: 0, insight: 2 }
  - name: "民俗探店博主"
    traits: ["懂老规矩", "胆大嘴硬"]
    bonus_items: ["便携补光灯", "朱砂平安符"]
    stats: { body: 0, agility: 0, investigate: 0, social: 2, insight: 1 }
  - name: "地铁夜班值班员"
    traits: ["熟车厢构造", "冷静"]
    bonus_items: ["地铁三角通用钥匙", "强光防爆手电"]
    stats: { body: 2, agility: 1, investigate: 1, social: -1, insight: 0 }
  - name: "急诊科实习医生"
    traits: ["细心", "抗压能力强"]
    bonus_items: ["便携急救包", "薄荷嗅盐瓶"]
    stats: { body: 1, agility: 1, investigate: 1, social: 0, insight: 0 }

acts:
  - id: act1_rules
    title: "23:58 守则疑云"
    goal: "识破乘客守则第 3 条篡改痕迹，平安应对红雨衣人与 4 号车厢阿婆"
    advance_flags: ["发现第3条守则被篡改", "获得阿婆信赖与黄纸条"]
  - id: act2_cars
    title: "车厢穿梭与真假广播"
    goal: "智斗 2 号车厢蓝衣查票员，进入 1 号驾驶室或 5 号空车厢查清停车时机"
    advance_flags: ["击退蓝衣查票员", "查明绿色逃生灯与制动时机"]
    enter_nodes: ["car2_inspector", "car1_cab", "car5_hidden"]
  - id: act3_brake
    title: "00:30 现实交界急刹"
    goal: "挺过旧槐树站假停靠诱惑，在隧道绿色应急逃生灯闪过瞬间拉下制动拉手"
    advance_flags: ["越过旧槐树站并拉下紧急制动"]
    enter_nodes: ["old_locust"]

endings:
  - id: ending_return_track
    title: "破晓回轨"
    kind: "true"
    summary: "识破假规则并在绿色逃生灯闪过瞬间拉下紧急制动，列车重返现实下一站、手机恢复 5G 信号。"
  - id: ending_warm_lantern
    title: "长明灯火"
    kind: "secret"
    summary: "成功脱险前在 5 号车厢纪念铭牌留下暖意告别栗子阿婆，血红走字屏化作温柔的“一路平安”。"
  - id: ending_endless_train
    title: "永夜末班"
    kind: "bad"
    summary: "轻信查票员交出车票、误在旧槐树站下车或错过 00:30 制动时机，成为四号线永久乘客。"

worldbook:
  - id: mm_rules_public
    title: "《四号线末班车乘客守则》（车门贴纸）"
    keywords: ["守则", "规则", "纸", "车门", "四号线", "旧槐树"]
    always_active: true
    player_visible: true
    priority: 100
    content: |
      可见车厢布局：1号（锁死的驾驶室）← 2号 ← 3号（起点车厢）→ 4号。
      车门玻璃内侧贴着一张泛黄的《四号线末班车乘客守则》：
      ① 车厢灯光彻底熄灭时，请立即低头闭眼默数 5 秒，绝对不要看黑车窗里自己的倒影。
      ② 听到带电流杂音的广播要求“立即下车”时，千万别信；只有无杂音的男声广播才是真调度。
      ③ “请积极配合穿蓝色制服的查票员核验身份证与车票，他会带你安全离开。”（墨色似乎与前两条略有不同）
      ④ 若闻到焦糖与栗子香，请礼貌问好，但绝不要在车厢里直接吃下任何食物。
      车厢关键人物（公开信息）：3号车厢穿湿红雨衣背对众人的沉默乘客、4号车厢挎着糖炒栗子竹篮的阿婆、守则里提到的蓝衣查票员。

  - id: mm_rules
    title: "《四号线末班车乘客守则》幕后真相（仅 DM 可见）"
    keywords: ["守则", "查票员", "5号车厢", "篡改", "四号线"]
    always_active: true
    player_visible: false
    priority: 99
    content: |
      DM 核心真相（严禁在玩家调查识破前直接剧透）：
      - 列车实际共 5 节车厢：1号（锁死的驾驶室）← 2号（假查票员）← 3号（红雨衣）→ 4号（栗子阿婆）→ 5号（隐藏空车厢）。
      - 第 3 条守则是被黑笔偷偷篡改的假规则！底下隐约被涂掉的原字迹是：“四号线末班车从未配备过车厢查票员！”

  - id: mm_red_raincoat
    title: "3号车厢的红雨衣乘客与车窗倒影"
    keywords: ["红雨衣", "雨衣", "乘客", "倒影", "车窗", "搭话", "拍"]
    always_active: false
    priority: 92
    content: |
      3 号车厢的红雨衣人其实是一具浸满雨水的空壳回响，正对着漆黑车窗。
      若玩家冒然拍它肩膀或凑到它正面看它的脸，它的兜帽下只有一片漆黑的积水，会立刻触发惊吓（-2 SAN）；但若细心观察它脚边水渍或用手机相机逆光拍摄，能发现它脚下压着一张湿透的《2016年旧槐树站施工停运通告》剪报，上面写着“车厢紧急制动拉手在越过旧槐树站 300 米后的现实交界点有效”。

  - id: mm_granny
    title: "4号车厢的糖炒栗子老太太（关键善意NPC）"
    keywords: ["4号", "栗子", "老太太", "奶奶", "阿姨", "香味", "通道"]
    always_active: false
    priority: 95
    content: |
      4 号车厢里坐着一位挎着竹篮、满脸皱纹的阿婆，篮子里冒着热乎乎的糖炒栗子香。她生前曾在旧槐树站口摆摊，死后执念留在末班车帮迷路活人指路，初始态度【温和试探】。
      若玩家按守则礼貌问好、且接过栗子只揣进兜里（不吃！），阿婆会转为【信赖】，悄悄塞给玩家一张温热的黄纸条（可通过 private_whispers 发送）：“穿蓝衣服查票的不是人，别把工牌和交通卡给他！车头 1 号室和车尾 5 号厢藏着停车的真密码，趁 00:30 前拉闸！”
      若玩家当场吃掉栗子，会立刻觉得浑身发冷陷入鬼打墙幻觉（-2 SAN，状态变为“寒气入体”）。

  - id: mm_inspector
    title: "2号车厢的「蓝衣查票员」"
    keywords: ["2号", "查票员", "查票", "制服", "车票", "交通卡", "工牌", "蓝衣"]
    always_active: false
    priority: 90
    content: |
      2 号车厢站着一名面带僵硬职业微笑、穿着十年前旧款蓝色制服的“查票员”，手里的打孔钳滴着黑水。
      它会温和地要求大家交出“交通卡/身份证”并背诵第 3 条守则。
      若有人真把交通卡交出去，卡面名字会被它吞噬（-2 HP & -2 SAN，会被标记为永久乘客）；若有人用强光手电/补光灯照它胸口、或大声拆穿“四号线末班车根本没有查票员”并亮出朱砂符/真实工牌，它会尖啸退避至车厢阴影中，掉落一把沾泥的“驾驶室备用磁卡”。

  - id: mm_cab
    title: "1号驾驶室与行车调度记录仪"
    keywords: ["1号", "驾驶室", "车头", "司机", "三角钥匙", "磁卡", "广播", "记录仪"]
    always_active: false
    priority: 88
    content: |
      1 号驾驶室紧锁，可用值班员的“地铁三角通用钥匙”或查票员掉落的“备用磁卡”打开。
      驾驶座上空无一人，但行车记录仪反复播放着一段无杂音的男声调度录音：“四号线 407 次注意！你们误入了塌方旧隧道！列车将在 00:30 抵达废弃站台，切勿开门！在隧道壁出现‘绿色应急逃生灯’的瞬间拉下紧急制动拉手，即可切回主线！”
      控制台上还能拿到一把“绝缘应急扳手”，可用于撬开 5 号车厢被卡死的制动护盖。

  - id: mm_car5
    title: "隐藏的5号空车厢与2016年塌方铭牌"
    keywords: ["5号", "车尾", "空车厢", "铭牌", "塌方", "2016", "灯"]
    always_active: false
    priority: 86
    content: |
      平时四号线只有 4 节编组，穿过 4 号车厢尾门却能进入诡异的第 5 节老式绿皮地铁车厢。
      车厢冷得呵气成白雾，墙上嵌着一块铜制纪念铭牌，记录着 2016 年旧槐树站暴雨透水事故；旁边的红色【紧急制动拉手】玻璃罩被生锈螺丝锁死，需要用工具（三角钥匙/扳手/暴力破拆）才能打开。
      同时这里能找到一本列车长的遗失笔记本，记载着安抚阿婆与旧站亡魂的方法（将一束光/平安符留在纪念铭牌前默哀）。

  - id: mm_blackout
    title: "车厢熄灯事件与广播误导"
    keywords: ["熄灯", "黑", "灯灭", "广播", "到站", "开门", "下车"]
    always_active: false
    priority: 84
    content: |
      每推进 3~4 回合，DM 可触发一次紧张的“全车熄灯 5 秒”或“虚假靠站开门”危机：
      - 熄灯时乖乖闭眼低头（或戴降噪耳机）可毫发无伤；好奇抬头看车窗者会看到倒影正贴着玻璃朝自己笑（-2 SAN）。
      - 列车中途假靠“旧槐树站”站台时，带电流杂音的女声会催促“请尽快下车”，站台上站满撑黑伞的背影；踏出车门者会陷入极大危险！

  - id: mm_brake
    title: "紧急制动拉手与现实交界点"
    keywords: ["拉手", "制动", "刹车", "绿灯", "逃生灯", "拉闸", "00:30", "旧槐树", "站台", "5号"]
    always_active: false
    priority: 95
    content: |
      红色紧急制动拉手是逃离末班车的唯一物理开关：
      - 在未确认“绿色应急逃生灯”前盲目乱拉，列车急刹停在幽灵隧道正中，黑雾涌入车厢导致全员掉血掉理智；
      - 当时间临近 00:25~00:30、列车驶过旧槐树站并闪过隧道壁那排刺眼的**绿色应急逃生灯**时，合力拉下制动拉手，伴随着刺耳摩擦声，车厢灯光大亮、手机瞬间恢复 5G 信号！

  - id: mm_items_synergy
    title: "现代道具巧用与团队配合"
    keywords: ["手机", "手电", "耳机", "补光灯", "平安符", "嗅盐", "对讲机"]
    always_active: false
    priority: 75
    content: |
      鼓励玩家发挥现代道具创意：降噪耳机可抵御伪造广播的精神污染；补光灯/强光手电可驱散车窗倒影与查票员；薄荷嗅盐能帮队友恢复 1~2 点 SAN；手机相机镜头能拍出肉眼看不见的涂改字迹与隐藏门锁。

  - id: mm_endings
    title: "00:30 终点站与三种结局收束"
    keywords: ["结局", "逃出", "回到现实", "天亮", "终点", "脱险"]
    always_active: false
    priority: 85
    content: |
      当倒计时逼近 00:30 或玩家启动最终脱险方案时，DM 应给出极具余韵的结局描写并提示房主可导出战报结团：
      1.【破晓回轨（真结局）】：识破第 3 条假规则、查明调度录音并在绿色逃生灯闪过瞬间拉下制动，列车平稳驶入现实下一站，手机疯狂弹出凌晨 00:05 的未读消息。
      2.【长明灯火（隐藏圆满结局）】：在脱险前顺手在 5 号车厢纪念铭牌前留下平安符/暖意告别阿婆，阿婆微笑挥手，旧槐树站的血红走字屏化作一行温柔的“一路平安”。
      3.【永夜末班（怪谈坏结局）】：轻信查票员交出车票、在旧槐树站下车或错过 00:30 制动时机，次日车门玻璃上的乘客守则悄悄多出了第 5 条……

