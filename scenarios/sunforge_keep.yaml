id: sunforge_keep
name: "剑湾晨钟 · 失落铸炉"
tagline: "经典 D&D d20 五幕中篇战役（2~3晚体量）——从边境酒馆启程，深入沉睡百年的矮人日蚀铸炉"
genre: "经典 D&D 奇幻战役 / 地下城探险与派系博弈"
theme: "ember"
dm_style: |
  你是一位深谙经典 D&D 剑湾战役节奏的资深地下城主（DM）。
  【本本专属文风】：豪爽铿锵的剑湾奇幻冒险风（像围坐炉火听游吟诗人讲真事，既有古老矮人铸炉的熔金壮阔，也有边境旅店里的鲜活调侃）。打斗描写讲究地形、兵器重量与招式后果，绝不流水账报菜名；营地短休/长休带出温暖的队友烟火气，矮人粗豪爱骂脏话、贵族学者端庄却爱算账，各路派系语气分明。
  【裁决习惯】：严格按本桌 D&D `d20` 检定结果（Nat 20 高光、Nat 1 整活、优势/劣势与熟练加值）以及 `/skill` 招牌技能精彩演戏；重视队友 `/assist` 配合；对妙计或精彩扮演在 `grant_inspiration` 中赏赐激励点；幕间提醒 `/rest` 休整，善用 `private_whispers` 触发角色暗线。
initial_location: "晨钟村 · 铜钟旅店"
initial_time: "丰收月七日 · 暮色初降 18:30"
opening_scene: |
  黄昏的余晖把晨钟村古老的青铜钟楼染成熔金，山脊另一侧却翻涌着反常的暗紫色灰云。
  你们围坐在「铜钟旅店」橡木长桌旁，烤鹿肉与蜂蜜麦酒的香气还未散尽，旅店木门便被一头浑身焦黑、鞍袋冒烟的矮人战骡撞开——车辕上绑着半块滚烫的符文精金锭，以及一封被血指印按穿的求援蜡封信：
  《致铁砧兄弟会与任意持剑之士：失落铸炉的“晨日核心”正在苏醒，灰烬议会已封锁焦岩古道。三日后日蚀降临前，若无人重启三道古矮人镇压闸，整座剑湾山谷将化为焦土。——失踪的大匠师 巴林·铜须》
  壁炉阴影里，一名披着红鸦斗篷的独臂斥候悄然吹灭了手边的油灯；而柜台后的老村长颤抖着捧出一袋叮当作响的金币，目光望向你们……
opening_actions:
  - "冒烟战骡与求援信：鞍袋绑着滚烫符文精金锭，可细查来历、检视血信或安抚战骡"
  - "悄然离席的红鸦斥候：听到消息便熄灯退场，可拦人盘问、暗中尾随或试探立场"
  - "捧出金币的老村长：对焦岩古道与矮人旧事知根知底，可打听情报、谈价钱或筹备补给"
player_brief:
  world_stage: "剑湾边境的晨钟村依山而建，山脊深处沉睡着百年前的矮人古迹「失落铸炉」。今夜暗紫灰云翻涌，一头焦黑战骡带来了失踪大匠师的血印求援信，各方势力闻风而动。"
  mission: "在三日后日蚀降临前，突破被灰烬议会封锁的焦岩古道、深入失落铸炉查清「晨日核心」苏醒真相，决定整座剑湾山谷与古矮人遗产的归属。"
  cast_intro:
    - "巴林·铜须（失踪的大匠师）：铁砧兄弟会核心人物，发出血印求援信警告日蚀灾变"
    - "老村长（铜钟旅店掌事）：愿出金币雇佣冒险者探明山谷异象与商道安危"
    - "红鸦斗篷独臂斥候：听到铸炉消息后立刻吹灯离席的神秘情报客"
    - "灰烬议会（敌对传闻势力）：据信已抢先封锁焦岩古道，意图不明"
  ending_paths:
    - "【重启镇压·晨钟长鸣】集齐关键线索与盟友，在日蚀前稳住晨日核心、保全山谷与古矮人传承"
    - "【阵营博弈·另辟蹊径】在兄弟会、商人与各方势力间借力周旋，走出利益或妥协的别样终局"
    - "【核心暴走·焦土余烬】若错失日蚀倒计时或在深处全军溃败，熔金灾火将吞没山谷"

player_defaults:
  max_hp: 16
  max_san: 12
  starter_items:
    - "冒险者行囊与干粮（3日份）"
    - "25枚剑湾金币"
    - "火把与打火石"
    - "基础治疗药水（回复4HP）"

