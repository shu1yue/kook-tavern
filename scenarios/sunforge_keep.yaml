acts:
  - id: act1_bell_inn
    title: "晨钟村的焦痕信骡"
    goal: "查清求援信真伪、红鸦斥候的身份与通往焦岩古道的秘密近道"
    advance_flags: ["获取古道地图或向导", "查明精金锭异变"]
  - id: act2_cinder_road
    title: "焦岩古道伏击与营火夜话"
    goal: "突破灰烬议会暗哨与被驱赶的地精骑兵，抵达失落铸炉峡谷前哨"
    advance_flags: ["突破焦岩哨卡", "抵达废堡山门"]
    enter_nodes: ["cinder_road", "old_watchtower"]
  - id: act3_outer_bailey
    title: "矮人废堡外庭与三方角力"
    goal: "穿越机关重重的石像外庭，决定与猩红鸦爪盗贼团或晨光巡查队合作还是对抗"
    advance_flags: ["打开铸炉内门", "找到大匠师失踪线索"]
    enter_nodes: ["dwarf_gate", "outer_bailey", "crow_hideout"]
  - id: act4_rune_forge
    title: "符文熔炉深厅与沉睡大匠师"
    goal: "关闭至少两道失控镇压闸，找到被囚禁的大匠师巴林并揭开灰烬议会真图谋"
    advance_flags: ["营救大匠师巴林", "掌握晨日核心停机口令"]
    enter_nodes: ["rune_forge", "vault_prison"]
  - id: act5_eclipse_altar
    title: "日蚀圣坛终决"
    goal: "在日蚀高悬前迎战执政官维克多与熔岩构装体，最终裁定晨日核心与剑湾山谷的命运"
    advance_flags: ["完成日蚀圣坛最终抉择"]
    enter_nodes: ["eclipse_altar"]

endings:
  - id: ending_sun_rekindled
    title: "晨钟重鸣 · 铸炉归光"
    kind: "true"
    summary: "营救大匠师巴林并成功重启三道镇压闸，击溃执政官维克多的日蚀仪轨，晨日核心重归温和庇佑剑湾。"
  - id: ending_brotherhood_oath
    title: "铁砧之誓 · 残火犹存"
    kind: "good"
    summary: "虽未能保住完整熔炉，但小队力挽狂澜强行封死核心裂隙并护送幸存者撤离，剑湾免于浩劫。"
  - id: ending_crow_pact
    title: "鸦翼金契 · 暗流易主"
    kind: "normal"
    summary: "与猩红鸦爪达成秘密交易，瓜分古矮人精金宝库并放任铸炉能量落入地下势力之手，小队富甲一方但暗影悄然蔓延。"
  - id: ending_ash_collapse
    title: "日蚀灰烬 · 铸炉永眠"
    kind: "bad"
    summary: "日蚀仪轨失控或小队力竭溃败，失落铸炉在剧烈震荡中彻底坍塌，山谷被漫天焦灰笼罩。"

