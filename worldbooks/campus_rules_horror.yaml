id: campus_rules_horror
name: 午夜十三楼：中式校园规则怪谈
genre: 规则怪谈 / 校园悬疑 / 心理推理
theme: fog
recommended_system: 2d6
recommended_acts: 3
license: CC0-1.0
author: AI 群酒馆开源世界书库
summary: 贴满矛盾守则的旧宿舍楼、熄灯后的广播杂音与永远多出一级的楼梯，主打在诡异规则夹缝中推理求生与揭开旧日真相。
starter_hooks:
  - 暴雨封校的周五深夜，宿舍大门突然多出一张泛黄的《夜间留宿守则》，而你们刚发现寝室里多出了一张写着陌生名字的床位
  - 废弃已久的旧实验楼在零点准时亮起四楼灯光，校园论坛里流传着“找齐五张失踪学生证就能离开循环”的匿名帖子
  - 晚自习下课铃晚响了十三分钟，走出教学楼的你们发现整座校园被灰雾吞没，只有广播站里传出沙哑的念名声
factions:
  - name: 宿管巡夜值班室
    goal: 机械地执行楼栋熄灯守则，但不同楼层的守则似乎互相矛盾
    escalation: 有人在熄灯后大声喧哗或打开红色应急灯
  - name: 校园怪谈互助社残存笔记
    goal: 前届困在楼里的学生留下的涂改线索，真假掺半
    escalation: 玩家发现两份字迹不同但署名相同的求生纸条
  - name: 十三年前旧校舍执念
    goal: 重复那场被掩盖的失火夜，诱使来访者替自己完成未竟的告别
    escalation: 午夜两点钟声响起或有人直呼禁忌旧名
entries:
  - id: wb_cr_core
    title: 灰雾封校与规则怪谈铁律
    keywords: [规则, 守则, 宿舍, 校园, 怪谈]
    always_active: true
    priority: 100
    content: 一旦夜雾笼罩这栋老旧的红砖教学/宿舍楼，手机便失去外网信号，只偶尔收到来自“校务通知”的诡异短信。墙上张贴的守则并非全是真的——有的规则救命，有的则是怪异混入的陷阱，唯有交叉比对字迹、日期与现实破绽才能活过今夜。
  - id: wb_cr_stairs
    title: 走廊声控灯与多出的台阶
    keywords: [楼梯, 走廊, 灯光, 电梯, 脚步]
    always_active: false
    priority: 92
    content: 熄灯后的走廊声控灯闪烁着惨白冷光。规则警告“上楼数到十三级台阶时不要回头”，而那部本已停修的老电梯偶尔会在没有按键时自行停在不存在的 4B 层。
  - id: wb_cr_broadcast
    title: 广播室滋啦杂音与点名录
    keywords: [广播, 喇叭, 录音, 声音, 名字]
    always_active: false
    priority: 88
    content: 顶楼广播室里放着一台落灰的磁带机，每当夜风吹过，走廊喇叭便会传出夹杂着电流声的旧日播报。如果听到自己的名字被陌生声线呼唤，切忌直接应答，但细听背景杂音往往能分辨出真实出口的位置。
  - id: wb_cr_archive
    title: 教务档案室与撕毁的年鉴
    keywords: [档案, 名单, 照片, 火灾, 旧楼]
    always_active: false
    priority: 85
    content: 锁在铁皮柜里的旧学年鉴被人为撕掉了其中一页，残留的合照边缘却多出一道穿旧式蓝白校服的模糊身影。拼凑出十三年前那场事故的真相与责任人，是打破午夜循环的真正钥匙。
  - id: wb_cr_mirror
    title: 水房镜子与红笔批注
    keywords: [水房, 镜子, 卫生间, 红笔, 便签]
    always_active: false
    priority: 82
    content: 走廊尽头水房的镜面常结着冷水雾，偶尔会浮现红笔写下的反向提醒。用冷水擦拭镜面可能会看清藏在门后的异物，但也可能与镜中倒影对上视线导致理智剧烈震荡。
  - id: wb_cr_bell
    title: 铜制旧校铃与破晓时限
    keywords: [校铃, 时间, 手表, 天亮, 钟声]
    always_active: false
    priority: 80
    content: 墙上的挂钟指针在 00:00 到 03:00 之间走得忽快忽慢。只有当真正的清晨第一声校铃敲响，或者有人以诚挚之物抚平旧楼核心执念时，封锁楼门的铁链才会应声松脱。
