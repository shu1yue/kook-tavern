id: cyber_kowloon_2099
name: 九龙霓虹 2099：赛博义体城
genre: 赛博朋克 / 霓虹潜入 / 黑客谍战
theme: metro
recommended_system: 2d6
recommended_acts: 3
license: CC0-1.0
author: AI 群酒馆开源世界书库
summary: 酸雨、立体贫民窟、义体黑诊所与巨型跨国财团共存的近未来都市，节奏明快，适合潜入窃密、街头火拼与赛博悬疑。
starter_hooks:
  - 中间人发来一笔高得反常的加密委托：在 4 小时内从财团高架列车上劫下一枚装有已故歌姬完整意识的生物芯片
  - 你们常去的义体诊所老医生突然失踪，诊所终端循环播放着一条被篡改的求救代码，直指 88 层的克隆实验室
  - 整个下城区的廉价义眼在同一秒刷出三秒血红雪花，随后街头接连出现声称自己被“远程接管身体”的失控路人
factions:
  - name: 苍穹生物科技集团
    goal: 掌控全城义体专利与记忆云端，任何泄露黑产的边缘人都将被清道夫抹除
    escalation: 核心生物芯片失窃或黑客攻破内网防火墙
  - name: 九龙城寨义体互助会
    goal: 在高企的维护费与帮派火拼中保住底层街坊的活路
    escalation: 劣质义体固件爆发大面积排异事故
  - name: 幽灵信使黑客网
    goal: 贩卖高价机密情报并寻找隐藏在旧网深处的原生 AI
    escalation: 财团启动黑墙清扫程序封锁下城基站
entries:
  - id: wb_ck_core
    title: 垂直霓虹都市·九龙 2099
    keywords: [九龙, 赛博, 霓虹, 酸雨, 城市]
    always_active: true
    priority: 100
    content: 2099 年的巨型立体都市被酸雨与全息广告牌分割成云端塔楼与终年不见天日的底层城寨。人人都装着不同档次的神经插槽与义体，信用点是唯一信仰，而一次走漏风声的交易就足以引来武装浮空车与企业清道夫。
  - id: wb_ck_clinic
    title: 暗巷义体诊所与黑市固件
    keywords: [诊所, 义体, 手术, 芯片, 排异]
    always_active: false
    priority: 90
    content: 底层巷子里的非法义体医生能用三折价格给你装上军用反射神经，但刷入来路不明的破解固件可能埋着远程监控后门。重伤时躲进相熟的地下诊所，能靠纳米修复凝胶迅速止血。
  - id: wb_ck_net
    title: 赛博空间潜行与 ICE 防火墙
    keywords: [黑客, 终端, 防火墙, 网络, 数据, 破解]
    always_active: false
    priority: 88
    content: 侵入企业内网需要物理接入局域端口或贴近无线中继。企业级“黑冰”防护程序会直接烧灼入侵者的神经接口（造成真实 SAN 与 HP 伤害），但一旦夺取门禁与监控权限，整栋大楼的炮塔都会倒戈。
  - id: wb_ck_fixer
    title: 地下酒吧与中间人行规
    keywords: [中间人, 酒吧, 情报, 悬赏, 交易]
    always_active: false
    priority: 85
    content: 霓虹灯下的拉面摊与地下爵士吧是雇佣兵接活的老地方。中间人从不问过程只看交付物，但行内有一条铁律：如果雇主给的报酬远超市场价，那这份委托八成藏着致命的背刺条款。
  - id: wb_ck_corp
    title: 巨企安保与清道夫小队
    keywords: [财团, 安保, 无人机, 浮空车, 清道夫]
    always_active: false
    priority: 82
    content: 巨企配备光学迷彩特工、热成像巡逻无人机和生物识别闸机。与其在狭窄走廊跟重甲安保硬拼，利用电磁脉冲瘫痪镜头、伪造访客工牌或借停电制造混乱才是边缘人的生存之道。
  - id: wb_ck_ghost
    title: 记忆备份与“电子幽灵”传闻
    keywords: [意识, 记忆, AI, 幽灵, 芯片]
    always_active: false
    priority: 80
    content: 城寨暗网盛传财团正在秘密把濒死天才的大脑映射成数字人格塞进生物芯片。那些被废弃的旧服务器里回荡着残缺的记忆碎片，有时甚至会通过公共全息屏向路过的有缘人发出求救。
