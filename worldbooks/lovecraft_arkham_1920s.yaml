id: lovecraft_arkham_1920s
name: 阿卡姆迷雾：1926 复古克苏鲁
genre: 洛氏神秘 / 1920s 调查 / 心理恐怖
theme: fog
recommended_system: d100
recommended_acts: 5
license: CC0-1.0 / Public Domain Mythos
author: AI 群酒馆开源世界书库
summary: 爵士乐、禁酒令、煤气灯雾夜与古老禁忌典籍交织的 1926 年新英格兰小镇，主打抽丝剥茧的理智调查与不可名状的真相。
starter_hooks:
  - 密大考古系教授在整理一批来自南太平洋的石板后人间蒸发，只留给几位学生一封盖着黑蜡封的求救电报
  - 港口一艘没有船员的蒸汽货轮在浓雾中自行靠岸，船舱里装满仍在缓慢跳动的玻璃标本罐与失踪船长的航海日志
  - 禁酒令下的地下爵士俱乐部里，每逢午夜响起那首无名萨克斯曲，听众就会集体遗忘过去三小时并梦到同一座水下尖塔
factions:
  - name: 密斯卡托尼克大学教研会
    goal: 收集并封存危险古籍，避免学术丑闻与校园恐慌扩散
    escalation: 禁书馆失窃或教授公开失态
  - name: 海岸警卫队与小镇警局
    goal: 维持表面治安与禁酒令执法，本能排斥一切超自然解释
    escalation: 码头出现离奇命案或调查员越权搜查
  - name: 银暮密教残党
    goal: 在星位对齐之夜唤醒沉睡的古老存在，视凡人皆为祭品
    escalation: 仪式关键圣物落入调查员手中
entries:
  - id: wb_ark_core
    title: 1926 年雾中阿卡姆的时代底色
    keywords: [阿卡姆, 1926, 小镇, 雾]
    always_active: true
    priority: 100
    content: 1926 年的秋雨让新英格兰的古老河谷小镇终日笼罩在煤烟与河雾中。老式福特 T 型车驶过鹅卵石路，电话仍需接线员人工转接，禁酒令催生了大量地下私酒馆。在这里枪弹并非万能，面对超越人类理解的异象，脆弱的理智（SAN）往往比肉体先一步崩溃。
  - id: wb_ark_library
    title: 密大图书馆与特藏室禁书
    keywords: [图书馆, 密大, 古籍, 文献, 档案]
    always_active: false
    priority: 92
    content: 大学图书馆二层锁着厚重的橡木特藏室，馆藏《死灵之书》残译本与多份十九世纪精神病院绝密病历。想借阅需要系主任手令、高超的交涉或午夜潜入；强行研读晦涩手稿虽能获得克制仪式的知识，却必然伴随着理智损耗。
  - id: wb_ark_asylum
    title: 河畔疗养院的失语病患
    keywords: [疗养院, 医院, 疯人院, 梦境, 病人]
    always_active: false
    priority: 88
    content: 坐落在城北松林里的红砖疗养院收治着数名曾在海上或古墓幸存的病人。他们在清醒时会用粉笔在墙角反复画出相同的几何星图，若有人耐心倾听并安抚其情绪，或许能拼凑出被警方删去的证词。
  - id: wb_ark_harbor
    title: 旧码头走私船与潮汐钟声
    keywords: [码头, 港口, 船, 走私, 渔民]
    always_active: false
    priority: 85
    content: 邻近海岸的旧码头鱼腥味浓重，本地老渔民对远海暗礁讳莫如深。黑帮借着浓雾运送私酒，但近来有船工发誓在船底看见过酷似两栖生物的苍白手印，海面退潮时还会浮出刻满螺旋纹的湿冷玄武岩。
  - id: wb_ark_press
    title: 《阿卡姆广告报》旧闻剪报室
    keywords: [报纸, 记者, 档案, 历史, 火灾]
    always_active: false
    priority: 82
    content: 报社地下室保存着近百年来所有地方新闻的微缩胶卷与剪报。许多看似无关的当下怪案，顺着十年前的失踪报道、地产拍卖记录或邪教纵火案追查，总能挖出惊人的家族隐秘。
  - id: wb_ark_ritual
    title: 神秘学禁忌与反制仪式
    keywords: [仪式, 法阵, 星位, 符号, 邪教]
    always_active: false
    priority: 80
    content: 面对不可名状的古老存在，正面火力往往徒劳无功。真正有效的生路在于打断献祭阵眼、毁掉作为媒介的古代雕像、或在星位闭合前完成反向放逐咒文——每一秒的拖延都会让现实空间进一步扭曲。
