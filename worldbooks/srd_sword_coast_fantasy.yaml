id: srd_sword_coast_fantasy
name: 剑湾边缘：古典奇幻自由城邦
genre: 经典西幻 / 剑与魔法 / 城邦冒险
theme: ember
recommended_system: d20
recommended_acts: 5
license: CC0-1.0 / SRD-Inspired
author: AI 群酒馆开源世界书库
summary: 海港城邦、冒险者公会、失落矮人遗迹与秘法塔交织的高魔古典奇幻世界观，适合 D&D 风格的探索、地城与权谋战役。
starter_hooks:
  - 城邦大选前夜，镇压港口海怪的古铜灯塔核心突然失窃，四大公会互相指责并暗中悬赏调查小队
  - 一支深入灰雾山谷的商队全员失联，唯有随行矮人铁匠的一只机械信鸦带着半张染血地城残图飞回酒馆
  - 秘法议会的高塔连续三夜传出龙吟，一名自称逃亡学徒的少女用一整袋金币雇你们潜入禁书地窖取回誓约卷轴
factions:
  - name: 银锚商业议会
    goal: 掌控海港关税与城防雇佣兵，极力压下一切会吓跑商船的丑闻
    escalation: 港口封锁或贵族丑闻公开曝光
  - name: 翡翠斗篷冒险者公会
    goal: 承接高危悬赏并守护平民，但高层正因新旧派理念分裂
    escalation: 公会资深小队遇袭或悬赏委托被恶意篡改
  - name: 星辉秘法塔
    goal: 垄断高环法术与古代遗物研究，对外界凡人保持傲慢与保密
    escalation: 魔网失控波动或禁书遗失消息外泄
  - name: 暗潮盗贼兄弟会
    goal: 统治下水道黑市与走私航道，以情报换取利益从不免费出手
    escalation: 城卫军突袭地下集市或叛徒私吞赃物
entries:
  - id: wb_sc_core
    title: 自由海港城邦·晨潮港风貌
    keywords: [晨潮港, 城邦, 港口, 酒馆]
    always_active: true
    priority: 100
    content: 晨潮港依悬崖而建，上城是白石尖塔与商业议会，中城是喧闹的集市与冒险者酒馆，下城则是潮湿的码头、船坞与错综复杂的旧下水道。这里金币能买通守卫，剑刃决定尊严，但任何在街区随意施放毁灭性法术的人都会立刻引来秘法塔的执法魔像。
  - id: wb_sc_guild
    title: 冒险者公会与悬赏规矩
    keywords: [公会, 悬赏, 委托, 任务板]
    always_active: false
    priority: 90
    content: 翡翠斗篷公会的大厅立着一块黑曜石任务板，铜级委托多为清剿哥布林或护送商队，银级以上则往往牵扯遗迹诅咒或贵族黑幕。公会酒保掌握着全城最新的小道消息，用一杯麦酒或交涉检定常能换到关键线索。
  - id: wb_sc_magic
    title: 魔网秩序与秘法遗物
    keywords: [魔法, 秘法, 符文, 卷轴, 法师]
    always_active: false
    priority: 88
    content: 古老遗迹中常残存失落纪元的附魔符文与魔晶核心。强行暴力破坏不稳定法阵可能引发奥术反噬，而懂得奥秘熟练的施法者能通过仪式稳定能量、甚至逆转陷阱机关。
  - id: wb_sc_underdark
    title: 下城暗渠与盗贼暗语
    keywords: [下水道, 黑市, 盗贼, 走私, 暗门]
    always_active: false
    priority: 85
    content: 城下遍布建城初期遗留的古老石拱蓄水暗渠，墙壁上刻着只有盗贼兄弟会能看懂的粉笔暗记（圆圈代表安全屋，叉号代表有毒气或陷阱）。穿过暗渠可绕过城卫军封锁直达上城贵族宅邸地窖。
  - id: wb_sc_ruins
    title: 灰雾山谷与矮人古堡传说
    keywords: [遗迹, 矮人, 地城, 山谷, 宝库]
    always_active: false
    priority: 82
    content: 城外三十里处的灰雾山谷埋藏着古老矮人氏族的地下熔炉要塞。传说他们当年为了锻造弑龙神兵触怒了地底深处的阴影，整座要塞一夜封门，至今仍有精良的秘银装备与发条守卫沉睡其中。
  - id: wb_sc_religion
    title: 黎明圣堂与圣水契约
    keywords: [圣堂, 牧师, 圣光, 誓约, 亡灵]
    always_active: false
    priority: 80
    content: 黎明圣堂的牧师们为受伤的冒险者提供廉价治疗与祝福，但他们对死灵术与血契有着零容忍的狂热态度。若小队在遗迹中遭遇不死生物，圣堂祝圣的银粉与圣水往往能打出决定性奇效。
