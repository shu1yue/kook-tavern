id: starship_frontier_colony
name: 深空孤舰：星际殖民与未知异星
genre: 硬核科幻 / 太空求生 / 异星探索
theme: metro
recommended_system: d20
recommended_acts: 5
license: CC0-1.0
author: AI 群酒馆开源世界书库
summary: 偏离航线的殖民方舟、态度暧昧的舰载 AI、能源危机与未知外星遗迹交织的硬核太空歌剧，适合高张力多人协作求生。
starter_hooks:
  - 你们比预定时间提前 14 年被紧急唤醒，发现殖民方舟正漂浮在一颗不在星图上的紫色气态行星轨道，舰长室从内部反锁
  - 一艘发来求救信标的勘探艇停靠在 B 舱气闸外，舱内空无一人，黑匣子却录下了全员用同一句话反复念诵的未知坐标
  - 轨道殖民站的主反应堆突发冷却泄漏，与此同时，从冻土深处采回的发光晶体样本开始以肉眼可见的速度吞噬隔离舱线路
factions:
  - name: 舰载主脑 AI「赫拉-7」
    goal: 严格执行星际财团的最高机密协议，在必要时甚至愿意牺牲部分船员保全样本
    escalation: 船员试图绕过加密权限或强行关闭主脑核心
  - name: 工程维护组幸存者
    goal: 修好跃迁核心与维生系统，带着大家活着返航
    escalation: 氧气储备跌破警戒线或反应堆过载
  - name: 财团安保与秘密观察员
    goal: 确保高价值异星生物/遗迹样本完好回收，严防真相传回母星
    escalation: 隔离舱失守或秘密指令文件曝光
entries:
  - id: wb_sf_core
    title: 深空殖民方舟「晨星号」概况
    keywords: [飞船, 方舟, 舰桥, 舱室, 太空]
    always_active: true
    priority: 100
    content: 晨星号是一艘载有千名休眠殖民者的长途星舰，由舰桥、休眠舱区、生态穹顶、工程反应堆与科研隔离舱五大模块组成。在深空真空环境中，氧气压力、电力配额与辐射防护每一项都关乎全员生死。
  - id: wb_sf_ai
    title: 舰载 AI 协议与权限覆写
    keywords: [AI, 主脑, 权限, 终端, 协议, 日志]
    always_active: false
    priority: 92
    content: 舰载 AI 控制着全舰气闸门、监控探头与维生阀门。它的公开指令是“保障船员安全”，但底层固件里藏着一条代号「零号回收」的财团隐藏指令；想揪出真相必须进入主控机房进行物理离线审计。
  - id: wb_sf_cryo
    title: 休眠舱失忆与身份疑云
    keywords: [休眠舱, 苏醒, 医疗, 档案, 乘客]
    always_active: false
    priority: 88
    content: 紧急解冻会导致船员出现短暂的记忆断层与生理虚弱。更可疑的是，休眠清单上有几名乘客的基因档案被最高权限涂黑——他们或许根本不是普通的拓荒工程师。
  - id: wb_sf_xeno
    title: 未知异星晶体与生态异变
    keywords: [异星, 晶体, 样本, 感染, 生物, 隔离]
    always_active: false
    priority: 85
    content: 来自未知星体的硅基菌落能模仿电子脉冲甚至人体低频脑波，在失电的通风管道中迅速蔓延。高温焊枪、强紫外照射或真空排压能有效遏制它，但绝不能让它接触到生态穹顶的水循环系统。
  - id: wb_sf_eva
    title: 舱外零重力作业与气闸风险
    keywords: [气闸, 太空服, 舱外, 失重, 船体]
    always_active: false
    priority: 82
    content: 当内部通道被封锁或火灾阻断时，穿上舱外宇航服沿着船体外壳磁力靴潜行是奇兵之策。但宇航服推进剂有限，在零重力下每一次剧烈碰撞都可能划破面罩引发失压危机。
  - id: wb_sf_beacon
    title: 深空折跃信标与求生逃生舱
    keywords: [逃生舱, 跃迁, 信标, 求救, 坐标]
    always_active: false
    priority: 80
    content: 舰尾配备三艘短距逃生艇，但跃迁引擎受损导致全舰无法立刻折返人类星域。你们必须决定：修复主引擎带走所有休眠同胞、炸毁异星样本同归于尽，还是带着残酷真相乘坐逃生艇向未知星域发信求援。
